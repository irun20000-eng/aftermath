<style id="site-css">/* ============================================================
   수능특강 미적분 I — 인터랙티브 해설 v2 (1학기 양식)
   태블릿 최적화 + 난이도 필터 + 인쇄 지원 + 풀이 공간 오버레이
   색상 톤: 보라 (purple/fuchsia)
   ============================================================ */

:root {
  --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
  --text-sm:   clamp(0.875rem, 0.8rem  + 0.35vw, 1rem);
  --text-base: clamp(1rem,     0.95rem + 0.25vw, 1.125rem);
  --text-lg:   clamp(1.125rem, 1rem    + 0.75vw, 1.5rem);
  --text-xl:   clamp(1.5rem,   1.2rem  + 1.25vw, 2.25rem);

  --space-1:0.25rem; --space-2:0.5rem;  --space-3:0.75rem; --space-4:1rem;
  --space-5:1.25rem; --space-6:1.5rem;  --space-8:2rem;    --space-10:2.5rem;

  --radius-sm:0.375rem; --radius-md:0.5rem; --radius-lg:0.75rem;
  --radius-xl:1rem;     --radius-full:9999px;

  --transition-fast: 150ms cubic-bezier(0.16,1,0.3,1);
  --transition-base: 220ms cubic-bezier(0.16,1,0.3,1);

  --font-display:'Noto Sans KR',sans-serif;
  --font-body:'Noto Sans KR',sans-serif;
  --font-math:Georgia,serif;

  --header-h: 116px;
  --footer-h: 64px;

  /* 난이도 색상 */
  --level-basic-bg:#fefce8;     --level-basic-text:#a16207;    --level-basic-border:#fde047;
  --level-example-bg:#faf5ff;   --level-example-text:#7e22ce;  --level-example-border:#e9d5ff;
  --level-exercise-bg:#f0fdf4;  --level-exercise-text:#15803d; --level-exercise-border:#bbf7d0;
  --level-standard-bg:#fff7ed;  --level-standard-text:#9a3412; --level-standard-border:#fed7aa;
  --level-advanced-bg:#fff1f2;  --level-advanced-text:#be123c; --level-advanced-border:#fecdd3;
  --level-kihul-bg:#fdf4ff;     --level-kihul-text:#86198f;    --level-kihul-border:#f5d0fe;
}

/* ── 라이트 ── */
:root,[data-theme="light"] {
  --color-bg:#faf5ff;         --color-surface:#ffffff;
  --color-surface-2:#fdf4ff;  --color-surface-offset:#f5edff;
  --color-border:#e9d5ff;     --color-divider:#f3e8ff;
  --color-text:#1a1a2e;       --color-text-muted:#6b21a8;
  --color-text-faint:#a78bfa; --color-text-inverse:#faf5ff;
  --color-primary:#a855f7;    --color-primary-hover:#9333ea;
  --color-primary-light:#e9d5ff; --color-primary-subtle:#f5edff;
  --color-blue-bg:#eff6ff;    --color-blue-border:#bfdbfe;  --color-blue-text:#1d4ed8;
  --color-green-bg:#f0fdf4;   --color-green-border:#bbf7d0; --color-green-text:#15803d;
  --color-yellow-bg:#fefce8;  --color-yellow-border:#fde047;--color-yellow-text:#a16207;
  --color-red-bg:#fef2f2;     --color-red-border:#fecaca;   --color-red-text:#b91c1c;
  --color-success:#7e22ce;    --color-success-bg:#faf5ff;
  --color-answer-bg:#faf5ff;  --color-answer-border:#d8b4fe;--color-answer-text:#581c87;
  --shadow-sm:0 1px 3px rgba(80,40,130,.06);
  --shadow-md:0 4px 16px rgba(80,40,130,.09);
  --shadow-lg:0 12px 40px rgba(80,40,130,.13);
}

/* ── 다크 ── */
[data-theme="dark"] {
  --color-bg:#1a1326;         --color-surface:#241834;
  --color-surface-2:#2b1d3f;  --color-surface-offset:#291a3c;
  --color-border:#412a5e;     --color-divider:#3a2552;
  --color-text:#f3e8ff;       --color-text-muted:#b794d8;
  --color-text-faint:#6b4587; --color-text-inverse:#1a1326;
  --color-primary:#c084fc;    --color-primary-hover:#d8b4fe;
  --color-primary-light:#5b2188; --color-primary-subtle:#2d1846;
  --color-blue-bg:#172040;    --color-blue-border:#1d4ed8;  --color-blue-text:#93c5fd;
  --color-green-bg:#052e16;   --color-green-border:#166534; --color-green-text:#86efac;
  --color-yellow-bg:#1c1505;  --color-yellow-border:#854d0e;--color-yellow-text:#fde047;
  --color-red-bg:#1c0505;     --color-red-border:#991b1b;   --color-red-text:#fca5a5;
  --color-success:#d8b4fe;    --color-success-bg:#2d1846;
  --color-answer-bg:#2d1846;  --color-answer-border:#7e22ce;--color-answer-text:#d8b4fe;
  --shadow-sm:0 1px 3px rgba(0,0,0,.25);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.45);
  /* 다크 난이도 */
  --level-basic-bg:#1c1505;     --level-basic-text:#fde047;    --level-basic-border:#854d0e;
  --level-example-bg:#2e1065;   --level-example-text:#d8b4fe;  --level-example-border:#7e22ce;
  --level-exercise-bg:#052e16;  --level-exercise-text:#86efac; --level-exercise-border:#166534;
  --level-standard-bg:#1c1005;  --level-standard-text:#fed7aa; --level-standard-border:#9a3412;
  --level-advanced-bg:#1c0505;  --level-advanced-text:#fda4af; --level-advanced-border:#be123c;
  --level-kihul-bg:#2e0a3f;     --level-kihul-text:#f0abfc;    --level-kihul-border:#86198f;
}

/* ── 리셋 ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);
  background:var(--color-bg);overflow-x:hidden;
  padding-top:var(--header-h);padding-bottom:var(--footer-h);
  opacity:0;transition:opacity 0.3s;line-height:1.7}
body.mathjax-ready{opacity:1}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
a{color:var(--color-primary);text-decoration:none}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}

/* ══════════════════════════════════
   HEADER
══════════════════════════════════ */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
  box-shadow:var(--shadow-sm);
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-3) var(--space-6);gap:var(--space-4);
}
.header-title{display:flex;align-items:center;gap:var(--space-3)}
.logo-icon{width:34px;height:34px;flex-shrink:0}
.school-name{font-size:var(--text-xs);font-weight:500;color:var(--color-text-muted);
  letter-spacing:.04em;display:block;line-height:1.2}
.site-title{font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;
  color:var(--color-text);line-height:1.2;white-space:nowrap}
.unit-name{color:var(--color-primary)}
.header-controls{display:flex;align-items:center;gap:var(--space-3);flex-shrink:0}
.progress-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-1)}
.progress-label{font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);font-variant-numeric:tabular-nums}
.progress-bar-track{width:80px;height:5px;background:var(--color-surface-offset);border-radius:var(--radius-full);overflow:hidden}
.progress-bar-fill{height:100%;background:var(--color-primary);border-radius:var(--radius-full);transition:width 350ms ease}
.btn-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-full);color:var(--color-text-muted);
  background:var(--color-surface-offset);border:1px solid var(--color-border);
  transition:all var(--transition-fast)}
.btn-icon:hover{background:var(--color-primary-subtle);color:var(--color-primary);border-color:var(--color-primary-light)}

/* ── 난이도 필터 바 ── */
.filter-bar{
  display:flex;gap:var(--space-2);padding:var(--space-2) var(--space-6) var(--space-3);
  overflow-x:auto;scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{
  display:inline-flex;align-items:center;gap:var(--space-1);
  padding:var(--space-1) var(--space-4);border-radius:var(--radius-full);
  font-size:var(--text-sm);font-weight:600;font-family:var(--font-display);
  color:var(--color-text-muted);background:var(--color-surface-offset);
  border:1.5px solid var(--color-border);white-space:nowrap;min-height:34px;
  transition:all var(--transition-fast);
}
.filter-btn:hover{background:var(--color-primary-subtle);color:var(--color-primary);border-color:var(--color-primary-light)}
.filter-btn.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.filter-count{
  font-size:var(--text-xs);font-weight:700;
  background:rgba(255,255,255,0.25);border-radius:var(--radius-full);
  padding:0 6px;min-width:20px;text-align:center;
}
.filter-btn:not(.active) .filter-count{background:var(--color-surface-2);color:var(--color-text-muted)}

/* 필터별 액티브 색 */
.filter-btn[data-filter="basic"].active    {background:var(--level-basic-text);border-color:var(--level-basic-text)}
.filter-btn[data-filter="example"].active  {background:var(--level-example-text);border-color:var(--level-example-text)}
.filter-btn[data-filter="exercise"].active {background:var(--level-exercise-text);border-color:var(--level-exercise-text)}
.filter-btn[data-filter="standard"].active {background:var(--level-standard-text);border-color:var(--level-standard-text)}
.filter-btn[data-filter="advanced"].active {background:var(--level-advanced-text);border-color:var(--level-advanced-text)}
.filter-btn[data-filter="kihul"].active    {background:var(--level-kihul-text);border-color:var(--level-kihul-text)}

/* ══════════════════════════════════
   MAIN AREA
══════════════════════════════════ */
.main-area{
  padding:var(--space-5) var(--space-5) var(--space-8);
}
.card-viewport{max-width:900px;margin:0 auto}

/* ── 문항 카드 ── */
.problem-card{animation:cardIn 280ms cubic-bezier(0.16,1,0.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-inner{display:flex;flex-direction:column;gap:var(--space-5)}

/* ── 문제 섹션 ── */
.problem-section{
  background:var(--color-surface);border:1.5px solid var(--color-border);
  border-radius:var(--radius-xl);padding:var(--space-6);box-shadow:var(--shadow-sm);
}
.problem-badge{
  display:inline-flex;align-items:center;
  font-family:var(--font-display);font-size:var(--text-sm);font-weight:700;
  border:1.5px solid;border-radius:var(--radius-full);
  padding:var(--space-1) var(--space-4);margin-bottom:var(--space-4);letter-spacing:.03em;
}
.problem-sub-label{
  display:inline-block;margin-left:var(--space-2);
  font-size:var(--text-xs);color:var(--color-text-faint);font-weight:500;
}
.problem-title{
  font-size:var(--text-lg);font-weight:800;color:var(--color-text);
  margin-bottom:var(--space-3);line-height:1.4;
}
.problem-statement{
  font-size:clamp(1.05rem,1rem + 0.6vw,1.35rem);font-weight:500;
  line-height:1.8;color:var(--color-text);margin-bottom:var(--space-3);max-width:none;
}
.problem-statement p{margin:0.4rem 0}
.choices{
  list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-2);
  margin-top:var(--space-3);
}
.choices li{
  padding:var(--space-3) var(--space-2);border:1.5px solid var(--color-border);
  border-radius:var(--radius-md);font-size:var(--text-sm);text-align:center;
  background:var(--color-surface-2);color:var(--color-text-muted);
  line-height:1.6;max-width:none;transition:all var(--transition-fast);
}
.short-answer-label{
  display:inline-flex;font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);
  background:var(--color-surface-offset);border:1px solid var(--color-border);
  border-radius:var(--radius-full);padding:var(--space-1) var(--space-3);margin-top:var(--space-3);
}
.graph-box{display:flex;justify-content:center;padding:var(--space-3) 0}
.graph-box svg{max-width:100%;height:auto}

/* ── 풀이 공간 ── */
.scratch-area{
  position:relative;min-height:120px;
  background-image:linear-gradient(var(--color-divider) 1px,transparent 1px),
                   linear-gradient(90deg,var(--color-divider) 1px,transparent 1px);
  background-size:28px 28px;background-color:var(--color-surface);
  border:1.5px dashed var(--color-border);border-radius:var(--radius-xl);overflow:hidden;
  cursor:pointer;transition:border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.scratch-area:hover{
  border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-subtle);
}
.scratch-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:var(--text-sm);font-weight:600;color:var(--color-text-faint);
  letter-spacing:.06em;pointer-events:none;display:flex;flex-direction:column;
  align-items:center;gap:var(--space-2);text-align:center;
}
.scratch-label::after{
  content:'터치하여 넓히기';
  font-size:var(--text-xs);color:var(--color-text-faint);opacity:.7;
}

/* ── 풀이 공간 오버레이 ── */
.scratch-overlay{
  position:fixed;inset:0;z-index:500;
  background:var(--color-bg);
  display:flex;flex-direction:column;
  animation:overlayIn 220ms cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes overlayIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
.scratch-overlay-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-4) var(--space-6);
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
  flex-shrink:0;
}
.scratch-overlay-title{
  font-family:var(--font-display);font-size:var(--text-base);font-weight:700;
  color:var(--color-text-muted);letter-spacing:.05em;text-transform:uppercase;
}
.scratch-overlay-close{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-full);background:var(--color-surface-offset);
  border:1.5px solid var(--color-border);color:var(--color-text-muted);
  font-size:1.4rem;line-height:1;cursor:pointer;
  transition:all var(--transition-fast);
}
.scratch-overlay-close:hover{
  background:var(--color-red-bg);color:var(--color-red-text);border-color:var(--color-red-border);
}
.scratch-overlay-body{display:flex;flex:1;min-height:0}
.scratch-overlay-problem{
  width:38%;max-width:520px;min-width:300px;
  overflow-y:auto;padding:var(--space-5) var(--space-6);
  border-right:1px solid var(--color-border);
  background:var(--color-surface);
}
.scratch-overlay-problem .problem-badge{margin-bottom:var(--space-3)}
.scratch-overlay-problem .problem-statement{
  font-size:var(--text-base);line-height:1.65;color:var(--color-text);
  margin:0 0 var(--space-4)
}
.scratch-overlay-problem .choices{margin-top:var(--space-3)}
@media (max-width:768px){
  .scratch-overlay-body{flex-direction:column}
  .scratch-overlay-problem{
    width:100%;max-width:none;min-width:0;max-height:38vh;
    border-right:none;border-bottom:1px solid var(--color-border)
  }
}
.scratch-overlay-canvas{
  flex:1;min-width:0;display:flex;flex-direction:column;
  background-color:var(--color-surface);
}
.overlay-step-bar{
  display:flex;flex-wrap:wrap;gap:var(--space-2);
  padding:var(--space-3) var(--space-4);
  border-bottom:1px solid var(--color-border);
  background:var(--color-surface-offset);flex-shrink:0;
}
.overlay-step-bar .step-btn{flex:0 0 auto}
.overlay-steps-container{
  flex:1;min-height:0;overflow-y:auto;
  padding:var(--space-4) var(--space-5);
  background-image:linear-gradient(var(--color-divider) 1px,transparent 1px),
                   linear-gradient(90deg,var(--color-divider) 1px,transparent 1px);
  background-size:32px 32px;
}
.overlay-steps-container .step{margin-bottom:var(--space-4)}
.overlay-steps-container .step:last-child{margin-bottom:0}
.overlay-nav{
  display:flex;align-items:center;gap:var(--space-2);
  margin-left:auto;margin-right:var(--space-3);
}
.overlay-nav-btn{
  padding:var(--space-2) var(--space-3);
  background:var(--color-surface-offset);
  border:1.5px solid var(--color-border);
  border-radius:var(--radius-md);
  font-size:var(--text-sm);font-weight:600;
  color:var(--color-text-muted);cursor:pointer;
  transition:all var(--transition-fast);
}
.overlay-nav-btn:hover:not(:disabled){
  background:var(--color-primary-subtle);color:var(--color-primary);
  border-color:var(--color-primary-light);
}
.overlay-nav-btn:disabled{opacity:.35;cursor:not-allowed}
.overlay-nav-label{
  font-size:var(--text-sm);color:var(--color-text-muted);
  font-weight:600;min-width:54px;text-align:center;
}

/* ── 해설 섹션 ── */
.solution-section{
  background:var(--color-surface);border:1.5px solid var(--color-border);
  border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-sm);
}
.solution-toggle-bar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);
  padding:var(--space-4) var(--space-6);background:var(--color-surface-offset);
  border-bottom:1px solid var(--color-border);
}
.solution-title{
  font-family:var(--font-display);font-size:var(--text-sm);font-weight:700;
  color:var(--color-text-muted);letter-spacing:.05em;text-transform:uppercase;
}
.step-buttons{display:flex;gap:var(--space-2);flex-wrap:wrap}
.step-btn{
  padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);
  font-size:var(--text-sm);font-weight:600;font-family:var(--font-display);
  color:var(--color-text-muted);background:var(--color-surface);
  border:1.5px solid var(--color-border);transition:all var(--transition-fast);
  min-height:40px;min-width:78px;
}
.step-btn:hover{background:var(--color-primary-subtle);color:var(--color-primary);border-color:var(--color-primary-light)}
.step-btn.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.reset-btn{color:var(--color-text-faint);border-style:dashed}
.reset-btn:hover{background:var(--color-red-bg);color:var(--color-red-text);border-color:var(--color-red-border);border-style:solid}
.answer-btn{color:var(--color-success);border-color:var(--color-answer-border)}
.answer-btn:hover{background:var(--color-answer-bg);color:var(--color-answer-text);border-color:var(--color-success)}
.answer-btn.active{background:var(--color-success);color:#fff;border-color:var(--color-success)}
.steps-container{padding:var(--space-5) var(--space-6);display:flex;flex-direction:column;gap:var(--space-5);min-height:60px}

/* ── STEP 카드 ── */
.step{animation:stepReveal 280ms cubic-bezier(0.16,1,0.3,1) both}
@keyframes stepReveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.step-header{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.step-tag{
  display:inline-flex;align-items:center;justify-content:center;
  padding:.15em var(--space-3);border-radius:var(--radius-full);
  font-family:var(--font-display);font-size:var(--text-xs);font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;background:var(--color-primary);color:#fff;flex-shrink:0;
}
.step-title{font-size:var(--text-base);font-weight:600;color:var(--color-text)}
.step-body{padding-left:calc(var(--space-3) + 2px);border-left:3px solid var(--color-primary-light)}
.step-body p{margin:0.5rem 0;line-height:1.7;color:var(--color-text-muted);font-size:var(--text-base)}
.step-body b{color:var(--color-text);font-weight:700}

/* ── 계산 박스 ── */
.calc{
  background:var(--color-surface-2);border:1px dashed var(--color-border);
  border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);
  margin:var(--space-2) 0;font-size:var(--text-base);line-height:1.8;
  color:var(--color-text);overflow-x:auto;
}
.calc.purple{
  background:var(--color-primary-subtle);border:1px solid var(--color-primary-light);
  color:var(--color-text);font-weight:500;
}

/* ── 힌트/경고 박스 ── */
.hint{
  background:var(--color-yellow-bg);border-left:4px solid var(--color-yellow-border);
  padding:var(--space-3) var(--space-4);border-radius:0 var(--radius-md) var(--radius-md) 0;
  margin:var(--space-3) 0;font-size:var(--text-sm);color:var(--color-yellow-text);line-height:1.7;
}
.warn{
  background:var(--color-red-bg);border-left:4px solid var(--color-red-border);
  padding:var(--space-3) var(--space-4);border-radius:0 var(--radius-md) var(--radius-md) 0;
  margin:var(--space-3) 0;font-size:var(--text-sm);color:var(--color-red-text);line-height:1.7;
}

/* ── 정답 표시 ── */
.answer-reveal{
  display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-5);
  padding:var(--space-4) var(--space-5);
  background:var(--color-answer-bg);border:2px solid var(--color-answer-border);border-radius:var(--radius-lg);
}
.answer-label{
  font-size:var(--text-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--color-success);font-family:var(--font-display);flex-shrink:0;
}
.answer-number{font-size:var(--text-xl);font-weight:700;color:var(--color-answer-text);font-family:var(--font-math)}

/* ── 정답 선지 강조 (revealed) — 정답 클릭 시 active ── */
.correct-choice.revealed{
  position:relative;
  background:linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%) !important;
  border:3px solid #10b981 !important;
  color:#064e3b !important;
  font-weight:800 !important;
  padding-left:2.75rem !important;
  box-shadow:0 0 0 4px rgba(16,185,129,0.18), 0 6px 14px rgba(16,185,129,0.22);
  animation:correctPulse 0.55s ease-out;
}
.correct-choice.revealed::before{
  content:'✓';position:absolute;left:0.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;background:#10b981;color:#fff;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:1rem;font-weight:900;box-shadow:0 2px 4px rgba(16,185,129,0.4);
}
@keyframes correctPulse{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(16,185,129,0.55)}
  50%{transform:scale(1.015);box-shadow:0 0 0 14px rgba(16,185,129,0)}
  100%{transform:scale(1);box-shadow:0 0 0 4px rgba(16,185,129,0.18), 0 6px 14px rgba(16,185,129,0.22)}
}
[data-theme="dark"] .correct-choice.revealed{
  background:linear-gradient(135deg, #064e3b 0%, #065f46 100%) !important;
  border-color:#34d399 !important;color:#d1fae5 !important;
}
[data-theme="dark"] .correct-choice.revealed::before{background:#34d399;color:#064e3b}

/* ── 핵심 개념 (key-concept) ── */
.key-concept{
  display:flex;align-items:flex-start;flex-wrap:wrap;gap:var(--space-3);
  margin-top:var(--space-4);padding:var(--space-3) var(--space-4);
  background:linear-gradient(135deg, #ecfdf5 0%, #f0fdfa 100%);
  border:1px solid #99f6e4;border-left:4px solid #14b8a6;
  border-radius:var(--radius-md);font-size:var(--text-base);color:#134e4a;
  line-height:1.7;max-width:none;
}
[data-theme="dark"] .key-concept{
  background:#042f2e;color:#5eead4;border-color:#0f766e;border-left-color:#14b8a6;
}
.concept-label{
  font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:#0f766e;color:#fff;padding:.1em var(--space-2);
  border-radius:var(--radius-sm);flex-shrink:0;
}

/* ══════════════════════════════════
   BOTTOM NAV
══════════════════════════════════ */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) var(--space-6);

  box-shadow:0 -4px 16px rgba(80,40,130,.07);
}
.nav-btn{
  display:flex;align-items:center;gap:var(--space-2);
  padding:var(--space-3) var(--space-6);border-radius:var(--radius-full);
  font-size:var(--text-base);font-weight:600;font-family:var(--font-display);
  background:var(--color-primary);color:#fff;min-height:48px;min-width:96px;
  transition:all var(--transition-fast);
  box-shadow:0 2px 8px color-mix(in srgb,var(--color-primary) 25%,transparent);
}
.nav-btn:hover{background:var(--color-primary-hover);transform:translateY(-1px)}
.nav-btn:active{transform:translateY(0)}
.nav-btn:disabled{background:var(--color-surface-offset);color:var(--color-text-faint);box-shadow:none;cursor:not-allowed;transform:none}
.problem-counter{flex:1;text-align:center;font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;color:var(--color-text);font-variant-numeric:tabular-nums}

══════════════════════════════════ */
.modal-backdrop{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;

}
.modal-backdrop.open{display:block;opacity:1}

  animation:modalIn 250ms cubic-bezier(0.16,1,0.3,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-title{font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;margin-bottom:var(--space-2)}
.modal-desc{font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-5)}
.modal-options{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-5)}
.modal-check{display:flex;flex-direction:column;gap:var(--space-3);margin-bottom:var(--space-6)}
.modal-sub-label{font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);margin:0 0 var(--space-1)}

.btn-primary{

  question:R`<p>곡선 \(y=x^2-2x+3\) 위의 점 \((3,\,6)\)에서의 접선이 점 \((2,\,a)\)를 지날 때, \(a\)의 값은? <small>[3.6점]</small></p>`,
  choices:[R`\(1\)`,R`\(2\)`,R`\(3\)`,R`\(4\)`,R`\(5\)`], answer:1, answerText:R`② \(2\)`,
  keypoint:R`접선의 기울기 = 접점에서의 미분계수 \(f'(a)\). 접선은 \(y=f'(a)(x-a)+f(a)\).`,
  steps:[
    {tag:'STEP 1', title:R`접선의 기울기`, body:R`<p>\(y'=2x-2\)이므로 \(x=3\)에서의 기울기는</p><div class="calc">\(y'(3)=2\cdot3-2=4\)</div>`},
    {tag:'STEP 2', title:R`접선의 방정식`, body:R`<div class="calc">\(y=4(x-3)+6=4x-6\)</div>`},
    {tag:'STEP 3', title:R`점 \((2,a)\) 대입`, body:R`<div class="calc purple">\(a=4\cdot2-6=2\)</div>`},
    {tag:'💡 꿀팁', title:R`기울기로 바로 계산`, body:R`<div class="hint">📌 접선을 다 세우지 않아도 된다. 접점 \((3,6)\)에서 \(x\)가 \(1\) 줄면 \(y\)는 기울기 \(4\)만큼 준다 → \(a=6-4=2\). 객관식에서는 이렇게 "기울기 × 이동량"으로 처리하면 10초 컷.</div>`}
  ]
},
/* ───────────── 2 ───────────── */
{
  id:'q2', level:'basic', levelLabel:'문항', num:2, type:'choice',
  subLabel:'함수의 극한의 성질 · 3.6점',
  title:R`극한의 성질로 \(\lim g(x)\) 구하기`,
  question:R`<p>다음 조건을 만족시키는 두 함수 \(f(x),\,g(x)\)에 대하여 \(\displaystyle\lim_{x\to\infty}g(x)\)의 값은? <small>[3.6점]</small></p>
<div class="calc">(가) \(\displaystyle\lim_{x\to\infty}f(x)=-2\)<br>(나) \(\displaystyle\lim_{x\to\infty}\{2f(x)+3g(x)\}=5\)</div>`,
  choices:[R`\(-3\)`,R`\(-1\)`,R`\(0\)`,R`\(1\)`,R`\(3\)`], answer:4, answerText:R`⑤ \(3\)`,
  keypoint:R`수렴하는 함수끼리의 합·차·실수배는 극한을 분리할 수 있다. 단, "수렴함"을 먼저 확인해야 한다.`,
  steps:[
    {tag:'STEP 1', title:R`\(g\)를 수렴하는 함수로 표현`, body:R`<p>\(g(x)\)가 수렴하는지 모르므로 바로 분리하지 않고, 수렴하는 함수들로 \(g\)를 나타낸다.</p><div class="calc">\(g(x)=\dfrac{1}{3}\big[\{2f(x)+3g(x)\}-2f(x)\big]\)</div>`},
    {tag:'STEP 2', title:R`극한값 계산`, body:R`<div class="calc purple">\(\displaystyle\lim_{x\to\infty}g(x)=\dfrac13\{5-2\cdot(-2)\}=\dfrac{9}{3}=3\)</div>`},
    {tag:'💡 꿀팁', title:R`"분리 전 수렴 확인" 습관`, body:R`<div class="hint">📌 서술형에서는 \(\lim\{2f+3g\}=2\lim f+3\lim g\)처럼 바로 쓰면 감점될 수 있다. \(g=\frac13\{(2f+3g)-2f\}\)로 <b>수렴하는 것들의 조합</b>으로 만든 뒤 분리하는 것이 정석.</div>`}
  ]
},
/* ───────────── 3 ───────────── */
{
  id:'q3', level:'basic', levelLabel:'문항', num:3, type:'choice',
  subLabel:'극한값과 다항함수 결정 · 3.7점',
  title:R`\(\lim f(x)/(x-4)^2=2\)인 삼차함수`,
  question:R`<p>삼차함수 \(f(x)\)가</p><div class="calc">\(\displaystyle\lim_{x\to4}\dfrac{f(x)}{(x-4)^2}=2,\quad f(5)=6\)</div><p>을 만족시킬 때, \(f'(6)\)의 값은? <small>[3.7점]</small></p>`,
  choices:[R`\(56\)`,R`\(57\)`,R`\(58\)`,R`\(59\)`,R`\(60\)`], answer:0, answerText:R`① \(56\)`,
  keypoint:R`분모 \(\to0\)이고 극한값이 존재하면 분자 \(\to0\). 분모가 \((x-4)^2\)이면 분자도 \((x-4)^2\)을 인수로 가진다.`,
  steps:[
    {tag:'STEP 1', title:R`인수 결정`, body:R`<p>극한값이 \(0\)이 아닌 실수로 존재하므로 \(f(x)\)는 \((x-4)^2\)을 인수로 가진다. 삼차함수이므로</p><div class="calc">\(f(x)=(x-4)^2(px+q)\)</div>`},
    {tag:'STEP 2', title:R`조건 대입`, body:R`<div class="calc">\(\displaystyle\lim_{x\to4}(px+q)=4p+q=2,\qquad f(5)=1\cdot(5p+q)=6\)</div><p>두 식을 빼면 \(p=4\), 따라서 \(q=2-16=-14\).</p><div class="calc purple">\(f(x)=(x-4)^2(4x-14)\)</div>`},
    {tag:'STEP 3', title:R`\(f'(6)\) 계산`, body:R`<div class="calc">\(f'(x)=2(x-4)(4x-14)+4(x-4)^2\)</div><div class="calc purple">\(f'(6)=2\cdot2\cdot10+4\cdot4=40+16=56\)</div>`},
    {tag:'💡 꿀팁', title:R`곱의 미분은 전개하지 말 것`, body:R`<div class="hint">📌 \(f(x)=(x-4)^2(4x-14)\)를 전개하면 계산 실수가 늘어난다. 곱의 미분법 \(\{u^2v\}'=2uu'v+u^2v'\)을 그대로 쓰고 숫자를 바로 대입하자.</div>`}
  ]
},
/* ───────────── 4 ───────────── */
{
  id:'q4', level:'basic', levelLabel:'문항', num:4, type:'choice',
  subLabel:'미분계수의 정의 · 3.7점',
  title:R`\(\lim\{f(x)-g(1)\}/(x-1)=g'(1)\)`,
  question:R`<p>함수 \(f(x)=2x^3+5x^2+x+2\)와 일차함수 \(g(x)\)가</p><div class="calc">\(\displaystyle\lim_{x\to1}\dfrac{f(x)-g(1)}{x-1}=g'(1)\)</div><p>을 만족시킬 때, \(g(4)\)의 값은? <small>[3.7점]</small></p>`,
  choices:[R`\(59\)`,R`\(60\)`,R`\(61\)`,R`\(62\)`,R`\(63\)`], answer:2, answerText:R`③ \(61\)`,
  keypoint:R`분모 \(\to0\) ⇒ 분자 \(\to0\): \(g(1)=f(1)\). 그러면 좌변은 미분계수 \(f'(1)\)의 정의가 된다.`,
  steps:[
    {tag:'STEP 1', title:R`\(g(1)\) 결정`, body:R`<p>극한값이 존재하고 분모 \(\to0\)이므로 분자 \(\to0\).</p><div class="calc">\(g(1)=f(1)=2+5+1+2=10\)</div>`},
    {tag:'STEP 2', title:R`좌변 = \(f'(1)\)`, body:R`<div class="calc">\(\displaystyle\lim_{x\to1}\dfrac{f(x)-f(1)}{x-1}=f'(1)=6+10+1=17\)</div><p>따라서 \(g'(1)=17\). 일차함수이므로 기울기가 \(17\).</p>`},
    {tag:'STEP 3', title:R`\(g(4)\)`, body:R`<div class="calc purple">\(g(x)=17(x-1)+10\ \Rightarrow\ g(4)=51+10=61\)</div>`},
    {tag:'💡 꿀팁', title:R`"\(g\)는 \(f\)의 접선"`, body:R`<div class="hint">📌 결국 \(g(x)\)는 곡선 \(y=f(x)\) 위의 점 \((1,10)\)에서의 접선이다. "\(g(1)=f(1)\), \(g'(1)=f'(1)\)"인 일차함수 = 접선이라는 연결을 기억하면 다른 문제에서도 빠르게 풀린다.</div>`}
  ]
},
/* ───────────── 5 ───────────── */
{
  id:'q5', level:'basic', levelLabel:'문항', num:5, type:'choice',
  subLabel:'평균값 정리 · 함숫값의 범위 · 3.8점',
  title:R`\(|f'(x)|\le3\)일 때 \(f(4)\)의 최대·최소`,
  question:R`<p>실수 전체의 집합에서 미분가능한 함수 \(f(x)\)가 다음 조건을 만족시킨다.</p><div class="calc">(가) \(f(0)=3\)<br>(나) 모든 실수 \(x\)에 대하여 \(|f'(x)|\le3\)이다.</div><p>\(f(4)\)의 최댓값을 \(M\), 최솟값을 \(m\)이라 하자. \(M+m\)의 값은? <small>[3.8점]</small></p>`,
  choices:[R`\(3\)`,R`\(4\)`,R`\(5\)`,R`\(6\)`,R`\(7\)`], answer:3, answerText:R`④ \(6\)`,
  keypoint:R`평균값 정리: \(\dfrac{f(b)-f(a)}{b-a}=f'(c)\)인 \(c\in(a,b)\)가 존재 → 도함수의 범위가 곧 평균변화율의 범위.`,
  steps:[
    {tag:'STEP 1', title:R`평균값 정리 적용`, body:R`<p>닫힌구간 \([0,4]\)에서 평균값 정리에 의해</p><div class="calc">\(\dfrac{f(4)-f(0)}{4-0}=f'(c)\quad(0\lt c\lt 4)\)</div>`},
    {tag:'STEP 2', title:R`범위 구하기`, body:R`<div class="calc">\(-3\le f'(c)\le3\ \Rightarrow\ -12\le f(4)-3\le12\ \Rightarrow\ -9\le f(4)\le15\)</div>`},
    {tag:'STEP 3', title:R`등호 성립 확인`, body:R`<p>\(f(x)=3x+3\)이면 \(f(4)=15\), \(f(x)=-3x+3\)이면 \(f(4)=-9\)로 양 끝값이 실제로 가능하다.</p><div class="calc purple">\(M+m=15+(-9)=6\)</div>`},
    {tag:'💡 꿀팁', title:R`"최대 기울기로 달리기"`, body:R`<div class="hint">📌 출발값 \(3\)에서 최대 기울기 \(\pm3\)으로 \(4\)칸 이동한다고 생각하면 \(3\pm12\). 최댓값·최솟값 문제에서는 반드시 <b>등호가 실제로 성립하는 예</b>(직선)를 확인하는 습관!</div>`}
  ]
},
/* ───────────── 6 ───────────── */
{
  id:'q6', level:'basic', levelLabel:'문항', num:6, type:'choice',
  subLabel:'함수방정식과 도함수 · 3.8점',
  title:R`\(f(x+y)=f(x)+f(y)+3xy\)`,
  question:R`<p>미분가능한 함수 \(f(x)\)가 다음 조건을 만족시킬 때, \(\displaystyle\lim_{h\to0}\dfrac{f(2+h)-f(2-h)}{h}\)의 값은? <small>[3.8점]</small></p><div class="calc">(가) 모든 실수 \(x,y\)에 대하여 \(f(x+y)=f(x)+f(y)+3xy\)<br>(나) \(\displaystyle\lim_{x\to0}\dfrac{f(x)}{x}=2\)</div>`,
  choices:[R`\(8\)`,R`\(10\)`,R`\(12\)`,R`\(14\)`,R`\(16\)`], answer:4, answerText:R`⑤ \(16\)`,
  keypoint:R`함수방정식은 \(x=y=0\) 대입으로 \(f(0)\)부터. 도함수는 정의 \(\lim\frac{f(x+h)-f(x)}{h}\)에 식을 넣는다.`,
  steps:[
    {tag:'STEP 1', title:R`\(f(0)\), \(f'(0)\)`, body:R`<p>\(x=y=0\) 대입: \(f(0)=2f(0)\Rightarrow f(0)=0\). 그러면 (나)는</p><div class="calc">\(\displaystyle f'(0)=\lim_{x\to0}\dfrac{f(x)-f(0)}{x}=2\)</div>`},
    {tag:'STEP 2', title:R`도함수 구하기`, body:R`<div class="calc">\(\displaystyle f'(x)=\lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}=\lim_{h\to0}\dfrac{f(h)+3xh}{h}=2+3x\)</div><p>따라서 \(f'(2)=8\).</p>`},
    {tag:'STEP 3', title:R`주어진 극한 변형`, body:R`<div class="calc">\(\displaystyle\lim_{h\to0}\dfrac{f(2+h)-f(2-h)}{h}=\lim\dfrac{f(2+h)-f(2)}{h}+\lim\dfrac{f(2-h)-f(2)}{-h}=2f'(2)\)</div><div class="calc purple">\(=2\cdot8=16\)</div>`},
    {tag:'💡 꿀팁', title:R`대칭 차분 = \(2f'(a)\)`, body:R`<div class="hint">📌 \(\dfrac{f(a+h)-f(a-h)}{h}\to2f'(a)\)는 공식처럼 외워 두자. 분모를 "증가량의 합"(\(h-(-h)=2h\))으로 보면 계수 \(2\)가 자연스럽게 보인다. 덤으로 \(f(x)=\frac32x^2+2x\)임도 알 수 있다.</div>`}
  ]
},
/* ───────────── 7 ───────────── */
{
  id:'q7', level:'standard', levelLabel:'문항', num:7, type:'choice',
  subLabel:'극값 조건 · 4.1점',
  title:R`\(x=1\)에서 극댓값 \(7\)인 삼차함수의 극솟값`,
  question:R`<p>함수 \(f(x)=x^3+ax^2+bx+3\)이 \(x=1\)에서 극댓값 \(7\)을 가질 때, 함수 \(f(x)\)의 극솟값은? (단, \(a,b\)는 상수이다.) <small>[4.1점]</small></p>`,
  choices:[R`\(-1\)`,R`\(0\)`,R`\(1\)`,R`\(2\)`,R`\(3\)`], answer:4, answerText:R`⑤ \(3\)`,
  keypoint:R`"\(x=k\)에서 극값 \(m\)" ⇒ \(f'(k)=0,\ f(k)=m\) 두 식.`,
  steps:[
    {tag:'STEP 1', title:R`연립방정식`, body:R`<div class="calc">\(f(1)=1+a+b+3=7\ \Rightarrow\ a+b=3\)<br>\(f'(1)=3+2a+b=0\ \Rightarrow\ 2a+b=-3\)</div><div class="calc purple">\(a=-6,\ b=9\)</div>`},
    {tag:'STEP 2', title:R`증감 확인`, body:R`<div class="calc">\(f'(x)=3x^2-12x+9=3(x-1)(x-3)\)</div><p>\(x=1\)에서 \(+\to-\)(극대), \(x=3\)에서 \(-\to+\)(극소). 조건과 일치.</p>`},
    {tag:'STEP 3', title:R`극솟값`, body:R`<div class="calc purple">\(f(3)=27-54+27+3=3\)</div>`},
    {tag:'💡 꿀팁', title:R`삼차함수 극값 차 공식으로 검산`, body:R`<div class="hint">📌 최고차항 계수 \(1\)인 삼차함수에서 두 극값 \(x\)좌표의 차가 \(d\)이면 (극댓값 − 극솟값) \(=\dfrac{d^3}{2}\). 여기서 \(d=2\) → 차 \(=4\) → \(7-4=3\). 검산용으로 유용.</div>`}
  ]
},
/* ───────────── 8 ───────────── */
{
  id:'q8', level:'standard', levelLabel:'문항', num:8, type:'choice',
  subLabel:'평균값 정리와 극한 · 4.1점',
  title:R`\(\lim f'(x)=4\)일 때 \(\lim\{f(2x+3)-f(2x-1)\}\)`,
  question:R`<p>실수 전체의 집합에서 미분가능한 함수 \(f(x)\)에 대하여 \(\displaystyle\lim_{x\to\infty}f'(x)=4\)일 때, \(\displaystyle\lim_{x\to\infty}\{f(2x+3)-f(2x-1)\}\)의 값은? <small>[4.1점]</small></p>`,
  choices:[R`\(8\)`,R`\(12\)`,R`\(16\)`,R`\(20\)`,R`\(25\)`], answer:2, answerText:R`③ \(16\)`,
  keypoint:R`함숫값의 차 \(\to\) 평균값 정리로 "구간 길이 × 도함수값"으로 바꾼다.`,
  steps:[
    {tag:'STEP 1', title:R`평균값 정리`, body:R`<p>구간 \([2x-1,\,2x+3]\)(길이 \(4\))에서</p><div class="calc">\(f(2x+3)-f(2x-1)=4f'(c_x)\quad(2x-1\lt c_x\lt 2x+3)\)</div>`},
    {tag:'STEP 2', title:R`극한`, body:R`<p>\(x\to\infty\)이면 \(c_x\gt 2x-1\to\infty\)이므로 \(f'(c_x)\to4\).</p><div class="calc purple">\(\displaystyle\lim_{x\to\infty}\{f(2x+3)-f(2x-1)\}=4\cdot4=16\)</div>`},
    {tag:'💡 꿀팁', title:R`"구간 길이"에만 주목`, body:R`<div class="hint">📌 \(2x\)의 계수는 함정. 결과는 <b>두 입력값의 차</b> \((2x+3)-(2x-1)=4\)에 \(\lim f'\)을 곱한 값이다. 감이 안 오면 \(f(x)=4x\)를 넣어 확인: \(4\cdot4=16\).</div>`}
  ]
},
/* ───────────── 9 ───────────── */
{
  id:'q9', level:'standard', levelLabel:'문항', num:9, type:'choice',
  subLabel:'인수분해와 연속함수 · 4.2점',
  title:R`\(\{f(x)\}^2=2x^2-3x+(x-3)f(x)\)`,
  question:R`<p>실수 전체의 집합에서 연속인 함수 \(f(x)\)가 모든 실수 \(x\)에 대하여</p><div class="calc">\(\{f(x)\}^2=2x^2-3x+(x-3)f(x)\)</div><p>를 만족시킨다. \(f(2)-f(-2)=-1\)일 때, \(f(3)-f(-3)\)의 값은? <small>[4.2점]</small></p>`,
  choices:[R`\(0\)`,R`\(1\)`,R`\(2\)`,R`\(3\)`,R`\(4\)`], answer:0, answerText:R`① \(0\)`,
  keypoint:R`\(\{f-A\}\{f-B\}=0\) 꼴 ⇒ 각 \(x\)마다 \(f=A\) 또는 \(f=B\). 연속이면 "갈아탈 수 있는 곳"은 \(A=B\)인 점뿐.`,
  steps:[
    {tag:'STEP 1', title:R`\(f(x)\)에 대한 이차식으로 인수분해`, body:R`<div class="calc">\(\{f(x)\}^2-(x-3)f(x)-x(2x-3)=0\)<br>\(\{f(x)+x\}\{f(x)-(2x-3)\}=0\)</div><p>각 \(x\)에서 \(f(x)=-x\) 또는 \(f(x)=2x-3\).</p>`},
    {tag:'STEP 2', title:R`갈아탈 수 있는 점`, body:R`<p>\(-x=2x-3\)에서 \(x=1\). 연속함수이므로 \(x\lt 1\)과 \(x\gt 1\) 각 구간에서는 한 식으로 고정된다.</p>`},
    {tag:'STEP 3', title:R`조건으로 결정`, body:R`<p>\(f(2)\in\{-2,\,1\}\), \(f(-2)\in\{2,\,-7\}\). \(f(2)-f(-2)=-1\)이 되는 조합은 \(1-2\)뿐.</p><div class="calc">\(x\gt 1\)일 때 \(f(x)=2x-3\), &nbsp; \(x\lt 1\)일 때 \(f(x)=-x\)</div><div class="calc purple">\(f(3)-f(-3)=3-3=0\)</div>`},
    {tag:'💡 꿀팁', title:R`그래프 두 직선을 그려라`, body:R`<div class="hint">📌 \(y=-x\)와 \(y=2x-3\) 두 직선을 그리면 \(f\)는 <b>교점 \((1,-1)\)에서만 선을 바꿀 수 있는</b> 경로다. 가능한 \(f\)는 4가지뿐이니 조건으로 하나를 고르면 끝.</div>`}
  ]
},
/* ───────────── 10 ───────────── */
{
  id:'q10', level:'standard', levelLabel:'문항', num:10, type:'choice',
  subLabel:'연속 조건과 함수 결정 · 4.2점',
  title:R`\((x^2-1)f(x)=ax^3+bx^2+cx+d\)`,
  question:R`<p>실수 전체의 집합에서 연속인 함수 \(f(x)\)가 모든 실수 \(x\)에 대하여</p><div class="calc">\((x^2-1)f(x)=ax^3+bx^2+cx+d\)</div><p>를 만족시키고, \(f(-1)=-1,\ f(1)=3\)일 때, \(f(0)\)의 값은? (단, \(a,b,c,d\)는 상수이다.) <small>[4.2점]</small></p>`,
  choices:[R`\(0\)`,R`\(1\)`,R`\(2\)`,R`\(3\)`,R`\(4\)`], answer:1, answerText:R`② \(1\)`,
  keypoint:R`\(x=\pm1\) 대입 ⇒ 우변 \(=0\) ⇒ 우변은 \((x^2-1)\)을 인수로 가짐 ⇒ \(f\)는 일차식.`,
  steps:[
    {tag:'STEP 1', title:R`우변의 인수`, body:R`<p>\(x=1,\,-1\)을 대입하면 좌변이 \(0\)이므로 우변도 \(0\). 따라서</p><div class="calc">\(ax^3+bx^2+cx+d=(x^2-1)(ax+k)\)</div>`},
    {tag:'STEP 2', title:R`\(f(x)\) 결정`, body:R`<p>\(x\ne\pm1\)에서 \(f(x)=ax+k\)이고, 연속이므로 \(x=\pm1\)에서도 \(f(x)=ax+k\).</p><div class="calc">\(f(1)=a+k=3,\quad f(-1)=-a+k=-1\)</div><div class="calc purple">\(k=1\ \Rightarrow\ f(0)=k=1\)</div>`},
    {tag:'💡 꿀팁', title:R`\(a\)까지 구할 필요 없음`, body:R`<div class="hint">📌 \(f(0)\)은 일차식의 상수항이므로 \(f(1)\)과 \(f(-1)\)의 <b>평균</b> \(\frac{3+(-1)}{2}=1\)로 바로 나온다.</div>`}
  ]
},
/* ───────────── 11 (수정 시행) ───────────── */
{
  id:'q11', level:'standard', levelLabel:'문항', num:11, type:'choice',
  subLabel:'연속 조건과 삼차함수 · 4.3점 · 수정 시행',
  title:R`\(g(x)\)가 연속이 되는 삼차함수의 극값 차`,
  question:R`<p>최고차항의 계수가 \(1\)인 삼차함수 \(f(x)\)에 대하여 함수</p><div class="calc">\(g(x)=\begin{cases}1 & (x\le1)\\ \dfrac{(x-1)^2}{f(x)-1} & (x\gt 1)\end{cases}\)</div><p>이 실수 전체의 집합에서 연속일 때, 함수 \(f(x)\)의 극댓값과 극솟값의 차는? <small>[4.3점]</small></p>
<!-- 1차 협의 후 수정본(x≤1에서 1) 기준. 원안(-1)은 g(2) 정의 불가로 오류였음. -->`,
  choices:[R`\(\dfrac19\)`,R`\(\dfrac{7}{54}\)`,R`\(\dfrac{4}{27}\)`,R`\(\dfrac16\)`,R`\(\dfrac{5}{27}\)`], answer:2, answerText:R`③ \(\dfrac{4}{27}\)`,
  keypoint:R`\(\dfrac{(x-1)^2}{f(x)-1}\)이 \(x\to1+\)에서 \(0\)이 아닌 값으로 수렴 ⇒ \(f(x)-1\)은 \((x-1)^2\)을 정확히 인수로 가진다.`,
  steps:[
    {tag:'STEP 1', title:R`\(x=1\)에서 연속 조건`, body:R`<div class="calc">\(\displaystyle\lim_{x\to1+}\dfrac{(x-1)^2}{f(x)-1}=g(1)=1\)</div><p>분자 \(\to0\)인데 극한값이 \(0\)이 아니므로 분모도 \(\to0\): \(f(1)=1\). 또한 \(f(x)-1\)이 \((x-1)\)만 가지면 극한 \(0\), \((x-1)^3\)이면 발산이므로</p><div class="calc">\(f(x)-1=(x-1)^2(x-k)\quad(k\ne1)\)</div>`},
    {tag:'STEP 2', title:R`\(k\) 결정`, body:R`<div class="calc">\(\displaystyle\lim_{x\to1+}\dfrac{1}{x-k}=\dfrac{1}{1-k}=1\ \Rightarrow\ k=0\)</div><div class="calc purple">\(f(x)=x(x-1)^2+1\)</div>`},
    {tag:'STEP 3', title:R`\(x\gt 1\)에서도 연속 확인`, body:R`<p>\(x\gt 1\)이면 \(f(x)-1=x(x-1)^2\gt 0\)이므로 분모가 \(0\)이 되는 점이 없어 \(g\)는 연속. ✔</p>`},
    {tag:'STEP 4', title:R`극값의 차`, body:R`<div class="calc">\(f'(x)=(x-1)^2+2x(x-1)=(x-1)(3x-1)\)</div><p>\(x=\frac13\)에서 극대, \(x=1\)에서 극소.</p><div class="calc purple">\(f\!\left(\tfrac13\right)-f(1)=\tfrac13\cdot\tfrac49=\dfrac{4}{27}\)</div>`},
    {tag:'💡 꿀팁', title:R`극값 차 공식으로 검산 + 수정 이유`, body:R`<div class="hint">📌 두 극점 사이 거리 \(d=1-\frac13=\frac23\) → 차 \(=\dfrac{d^3}{2}=\dfrac{8/27}{2}=\dfrac{4}{27}\). 7번과 같은 공식!</div><div class="warn">⚠️ 원안처럼 \(x\le1\)에서 \(g=-1\)이면 \(k=2\)가 되어 \(f(2)=1\), 즉 \(x=2\)에서 분모가 \(0\)이 되어 연속일 수 없다. STEP 3의 "분모가 0이 되는 점 확인"이 바로 그 함정을 걸러내는 단계.</div>`}
  ]
},
/* ───────────── 12 ───────────── */
{
  id:'q12', level:'standard', levelLabel:'문항', num:12, type:'choice',
  subLabel:'극한의 존재 조건 · 4.3점',
  title:R`극한이 존재하지 않는 \(a\)가 \(0,4\)뿐`,
  question:R`<p>이차함수 \(f(x)\)에 대하여</p><div class="calc">\(\displaystyle\lim_{x\to2}\dfrac{f(x)+1}{(x-2)\{f(x)+f(a)\}}\)</div><p>의 값이 존재하지 않도록 하는 실수 \(a\)의 값이 \(0\)과 \(4\)뿐일 때, \(f(6)\)의 값은? <small>[4.3점]</small></p>`,
  choices:[R`\(1\)`,R`\(3\)`,R`\(5\)`,R`\(7\)`,R`\(9\)`], answer:3, answerText:R`④ \(7\)`,
  keypoint:R`"대부분의 \(a\)에서 극한 존재" ⇒ 분자 \(\to0\): \(f(2)=-1\). 남은 실패 원인은 \(f(2)+f(a)=0\), 즉 \(f(a)=1\).`,
  steps:[
    {tag:'STEP 1', title:R`\(f(2)=-1\)`, body:R`<p>\(f(2)\ne-1\)이면 분자 \(\not\to0\), 분모 \(\to0\)이 되어 <b>모든 \(a\)</b>에서 극한이 존재하지 않는다. 조건에 모순이므로 \(f(2)=-1\).</p><div class="calc">\(f(x)+1=(x-2)p(x)\quad(p\text{는 일차 이하})\)</div>`},
    {tag:'STEP 2', title:R`극한이 존재하지 않는 경우`, body:R`<div class="calc">\(\displaystyle\lim_{x\to2}\dfrac{p(x)}{f(x)+f(a)}\)</div><p>분모의 극한은 \(f(2)+f(a)=f(a)-1\). 이것이 \(0\)이 아니면 극한 존재, \(f(a)=1\)이면 분모 \(\to0\)이 되어 존재하지 않는다(분자 \(p(2)=0\)이어도 \(\frac{1}{x-2}\) 꼴로 발산).</p>`},
    {tag:'STEP 3', title:R`\(f(x)-1\)의 근이 \(0,4\)`, body:R`<p>\(f(a)=1\)인 \(a\)가 \(0,4\)뿐이므로</p><div class="calc">\(f(x)-1=c\,x(x-4)\)</div><div class="calc">\(f(2)=-4c+1=-1\ \Rightarrow\ c=\tfrac12\)</div><div class="calc purple">\(f(6)=\tfrac12\cdot6\cdot2+1=7\)</div>`},
    {tag:'💡 꿀팁', title:R`"극한이 존재하지 않는 원인" 분류`, body:R`<div class="hint">📌 \(\frac{0}{0}\)이 아닌 "\(\frac{\text{0 아닌 수}}{0}\)"이 발산의 원인. 원인 후보를 ① 분자 쪽 ② 분모 쪽으로 나눠 보면, ①은 모든 \(a\)에 해당하므로 막혀야 하고 ②만 \(a\)에 따라 달라진다.</div>`}
  ]
},
/* ───────────── 13 ───────────── */
{
  id:'q13', level:'standard', levelLabel:'문항', num:13, type:'choice',
  subLabel:'극한과 미분계수 · 4.3점',
  title:R`\(\{f^2-g^2\}/\{2(x^2-4)\}\)의 극한`,
  question:R`<p>두 다항함수 \(f(x),\,g(x)\)가 다음 조건을 만족시킬 때, \(f'(2)+g'(2)\)의 값은? <small>[4.3점]</small></p><div class="calc">(가) \(\displaystyle\lim_{x\to2}\dfrac{\{f(x)\}^2-\{g(x)\}^2}{2(x^2-4)}=f(2)-g(2)\)<br>(나) \(f(2)g(2)=-9\)</div>`,
  choices:[R`\(8\)`,R`\(9\)`,R`\(10\)`,R`\(11\)`,R`\(12\)`], answer:0, answerText:R`① \(8\)`,
  keypoint:R`\(f^2-g^2=(f-g)(f+g)\). 분모 \(\to0\) ⇒ 어느 인수가 \(0\)이 되는지 (나)로 판별.`,
  steps:[
    {tag:'STEP 1', title:R`어느 인수가 0인가`, body:R`<p>분모 \(\to0\)이므로 \(\{f(2)\}^2=\{g(2)\}^2\). \(f(2)=g(2)\)이면 (나)에서 \(\{f(2)\}^2=-9\) 불가능. 따라서</p><div class="calc">\(f(2)+g(2)=0,\quad f(2)-g(2)=2f(2)\ne0\)</div>`},
    {tag:'STEP 2', title:R`극한 계산`, body:R`<div class="calc">\(\displaystyle\lim_{x\to2}\dfrac{f(x)-g(x)}{2(x+2)}\cdot\dfrac{f(x)+g(x)}{x-2}=\dfrac{f(2)-g(2)}{8}\cdot\{f'(2)+g'(2)\}\)</div><p>(\(f+g\)는 \(x=2\)에서 값이 \(0\)이므로 뒤쪽은 \((f+g)'(2)\).)</p>`},
    {tag:'STEP 3', title:R`(가)와 비교`, body:R`<div class="calc">\(\dfrac{f(2)-g(2)}{8}\{f'(2)+g'(2)\}=f(2)-g(2)\)</div><p>\(f(2)-g(2)\ne0\)이므로 양변을 나누면</p><div class="calc purple">\(f'(2)+g'(2)=8\)</div>`},
    {tag:'💡 꿀팁', title:R`(나)는 "경우 제거용"`, body:R`<div class="hint">📌 \(fg=-9\lt 0\)은 값을 구하라는 조건이 아니라 <b>\(f(2)=g(2)\)인 경우를 지우는 장치</b>다. 실제로 \(f(2)=\pm3\) 중 무엇이든 답은 \(8\)로 같다.</div>`}
  ]
},

  choices:[R`\(9\pi\)`,R`\(\dfrac{28}{3}\pi\)`,R`\(10\pi\)`,R`\(\dfrac{32}{3}\pi\)`,R`\(11\pi\)`], answer:3, answerText:R`④ \(\dfrac{32}{3}\pi\)`,
  keypoint:R`변수 하나(중심~밑면 거리 \(x\))로 높이와 밑면 반지름을 모두 표현 → 부피를 \(x\)의 함수로 놓고 미분.`,
  steps:[
    {tag:'STEP 1', title:R`변수 설정`, body:R`<p>구의 중심 O에서 밑면까지의 거리를 \(x\ (0\le x\lt 3)\)라 하면</p><div class="calc">높이 \(h=3+x,\quad\) 밑면 반지름 \(r^2=9-x^2\)</div>`},
    {tag:'STEP 2', title:R`부피 함수`, body:R`<div class="calc">\(V(x)=\dfrac{\pi}{3}(9-x^2)(3+x)=\dfrac{\pi}{3}(3-x)(3+x)^2\)</div>`},
    {tag:'STEP 3', title:R`미분`, body:R`<div class="calc">\(V'(x)=\dfrac{\pi}{3}\{-(3+x)^2+2(3-x)(3+x)\}=\dfrac{\pi}{3}(3+x)(3-3x)\)</div><p>\(x=1\)에서 \(+\to-\)이므로 최대.</p>`},
    {tag:'STEP 4', title:R`최댓값`, body:R`<div class="calc purple">\(V(1)=\dfrac{\pi}{3}\cdot2\cdot16=\dfrac{32}{3}\pi\)</div>`},
    {tag:'💡 꿀팁', title:R`인수분해된 형태 유지 + 결과 기억`, body:R`<div class="hint">📌 \((3-x)(3+x)^2\)처럼 인수분해된 꼴로 두면 미분 후 공통인수 \((3+x)\)가 바로 묶인다. 결과도 기억해 두자: 반지름 \(R\)인 구에 내접하는 원뿔은 <b>높이 \(\frac43R\)</b>일 때 최대 (여기서 \(h=4\)).</div>`}
  ]

<div class="calc">ㄱ. \(\displaystyle\lim_{x\to0}h(a+x)h(a-x)=-1\)<br>ㄴ. 함수 \(\{h(x)\}^2\)은 \(x=b\)에서 미분가능하다.<br>ㄷ. 함수 \(I(x)=\begin{cases}f(x)+a^2-3a & (x\lt a)\\ g(x) & (x\ge a)\end{cases}\)에 대하여, 함수 \((x-3)I(x)\)가 실수 전체에서 연속이 되도록 하는 모든 실수 \(a\)의 곱은 \(2\)이다.</div>`,
  choices:[R`ㄱ`,R`ㄷ`,R`ㄱ, ㄴ`,R`ㄴ, ㄷ`,R`ㄱ, ㄴ, ㄷ`], answer:2, answerText:R`③ ㄱ, ㄴ`,
  keypoint:R`\(x\to0\)의 극한은 \(x\to0+\), \(x\to0-\)를 나누어 확인. \(\{h\}^2\)의 미분가능성은 "꺾인 점이 0이면 제곱하면 매끄러워진다".`,
  steps:[
    {tag:'STEP 1', title:R`ㄱ — 좌우 나누기`, body:R`<p>\(x\to0+\): \(h(a+x)\to g(a)=-1\), \(h(a-x)\to\displaystyle\lim_{t\to a-}f(t)=1\) → 곱 \(-1\).</p><p>\(x\to0-\): \(h(a+x)\to1\), \(h(a-x)\to-1\) → 곱 \(-1\).</p><div class="calc purple">좌우 극한 모두 \(-1\) → ㄱ 참</div>`},
    {tag:'STEP 2', title:R`ㄴ — 꺾인 점에서 제곱`, body:R`<p>\(x=b\) 근방에서 \(h(x)=m(x-b)\ (x\lt b)\), \(h(x)=-n(x-b)\ (x\gt b)\) 꼴(\(m,n\gt 0\)).</p><div class="calc">\(\{h(x)\}^2=m^2(x-b)^2\) 또는 \(n^2(x-b)^2\)</div><p>좌·우 미분계수가 모두 \(0\)이므로 미분가능. <b>ㄴ 참</b></p>`},
    {tag:'STEP 3', title:R`ㄷ — 연속 조건`, body:R`<p>\(I(x)\)는 \(x=a\)에서만 불연속일 수 있다. \((x-3)I(x)\)가 \(x=a\)에서 연속:</p><div class="calc">\((a-3)\{1+a^2-3a\}=(a-3)\cdot(-1)\)</div><div class="calc">\(a=3\) 또는 \(a^2-3a+2=0\ \Rightarrow\ a=1,2\)</div><div class="calc purple">모든 \(a\)의 곱 \(=1\cdot2\cdot3=6\ne2\) → ㄷ 거짓</div>`},
    {tag:'💡 꿀팁', title:R`"\(a=3\)" 빠뜨리기 함정`, body:R`<div class="warn">⚠️ \(1+a^2-3a=-1\)만 풀면 곱이 \(2\)가 되어 ㄷ을 참으로 고르게 된다. 곱해진 \((x-3)\)은 <b>\(x=3\)에서 불연속을 "지워 주는" 인수</b>이므로 \(a=3\)도 해!</div><div class="hint">📌 ㄴ은 "\(|h|\)가 아니라 \(h^2\)"이라는 점이 핵심. 값이 \(0\)인 꺾인 점에서 \(h^2\)은 항상 미분가능하다.</div>`}
  ]
},

{
  id:'q16', level:'advanced', levelLabel:'문항', num:16, type:'choice',
  subLabel:'교점 개수 함수 · 연속 · 4.7점',
  title:R`\(y=|x^2-4|\)와 \(y=x+t\)의 교점 개수 \(g(t)\)`,
  question:R`<p>실수 \(t\)와 함수 \(f(x)=|x^2-4|\)에 대하여 곡선 \(y=f(x)\)와 직선 \(y=x+t\)가 만나는 서로 다른 점의 개수를 \(g(t)\)라 하자. 최고차항의 계수가 \(1\)인 삼차함수 \(h(t)\)에 대하여 함수 \(h(t)g(t)\)가 실수 전체의 집합에서 연속일 때, \(h(4)\)의 값은? <small>[4.7점]</small></p>`,
  choices:[R`\(-3\)`,R`\(-2\)`,R`\(-1\)`,R`\(0\)`,R`\(1\)`], answer:0, answerText:R`① \(-3\)`,
  keypoint:R`\(g(t)\)가 불연속인 \(t\)에서 \(h(t)=0\)이면 \(h(t)g(t)\)는 연속이 된다. 기울기 \(1\)인 직선을 위아래로 평행이동하며 경계를 찾는다.`,
  steps:[
    {tag:'STEP 1', title:R`경계가 되는 직선`, body:R`<p>직선 \(y=x+t\)를 위로 올리며 관찰한다.</p><div class="calc">점 \((2,0)\) 통과: \(t=-2\)<br>점 \((-2,0)\) 통과: \(t=2\)<br>\(y=4-x^2\)에 접함: \(x^2+x+t-4=0\)의 판별식 \(17-4t=0\Rightarrow t=\frac{17}{4}\)</div>`},
    {tag:'STEP 2', title:R`\(g(t)\) 표`, body:R`<div class="calc">\(t\lt -2:0\ \ |\ \ t=-2:1\ \ |\ \ -2\lt t\lt 2:2\ \ |\ \ t=2:3\)<br>\(2\lt t\lt \frac{17}{4}:4\ \ |\ \ t=\frac{17}{4}:3\ \ |\ \ t\gt \frac{17}{4}:2\)</div><p>불연속점: \(t=-2,\ 2,\ \frac{17}{4}\)</p>`},
    {tag:'STEP 3', title:R`\(h(t)\) 결정`, body:R`<p>세 점에서 \(g\)의 좌극한·우극한·함숫값이 모두 다르므로 \(h(t)=0\)이어야 한다.</p><div class="calc">\(h(t)=(t+2)(t-2)\left(t-\tfrac{17}{4}\right)\)</div><div class="calc purple">\(h(4)=6\cdot2\cdot\left(-\tfrac14\right)=-3\)</div>`},
    {tag:'💡 꿀팁', title:R`접선 기울기 = 직선 기울기인 곳 먼저`, body:R`<div class="hint">📌 교점 개수가 바뀌는 순간은 ① 꺾인 점(여기선 \((\pm2,0)\))을 지날 때 ② 곡선에 접할 때 뿐이다. ②는 \(f'(x)=1\)에서 바로: \(-2x=1\Rightarrow x=-\frac12\), 접점 \(\left(-\frac12,\frac{15}{4}\right)\) → \(t=\frac{15}{4}+\frac12=\frac{17}{4}\). 판별식보다 빠르다.</div>`}
  ]
},
/* ───────────── 17 ───────────── */
{
  id:'q17', level:'advanced', levelLabel:'문항', num:17, type:'choice',
  subLabel:'구간 최솟값 함수 · 4.8점',
  title:R`\([0,2]\)에서 최솟값 \(h(t)\)의 최댓값`,
  question:R`<p>실수 \(t\)와 함수 \(f(x)=x^3-\dfrac32tx^2+t\)에 대하여 닫힌구간 \([0,\,2]\)에서 함수 \(f(x)\)의 최솟값을 \(h(t)\)라 할 때, \(h(t)\)의 최댓값은? <small>[4.8점]</small></p>`,
  choices:[R`\(\dfrac{2\sqrt6}{27}\)`,R`\(\dfrac{\sqrt6}{9}\)`,R`\(\dfrac{4\sqrt6}{27}\)`,R`\(\dfrac{5\sqrt6}{27}\)`,R`\(\dfrac{2\sqrt6}{9}\)`], answer:4, answerText:R`⑤ \(\dfrac{2\sqrt6}{9}\)`,
  keypoint:R`극소점 \(x=t\)가 구간 안에 있느냐 없느냐로 경우를 나눈다.`,
  steps:[
    {tag:'STEP 1', title:R`도함수`, body:R`<div class="calc">\(f'(x)=3x^2-3tx=3x(x-t)\)</div><p>\(x=0\)과 \(x=t\)가 임계점. \(f(0)=t,\ f(2)=8-5t,\ f(t)=t-\frac{t^3}{2}\).</p>`},
    {tag:'STEP 2', title:R`경우 나누기`, body:R`<div class="calc">\(t\le0\): \([0,2]\)에서 증가 → \(h(t)=f(0)=t\le0\)<br>\(0\lt t\lt 2\): \(x=t\)에서 극소 → \(h(t)=t-\dfrac{t^3}{2}\)<br>\(t\ge2\): 감소 → \(h(t)=8-5t\le-2\)</div>`},
    {tag:'STEP 3', title:R`\(0\lt t\lt 2\)에서 최대`, body:R`<div class="calc">\(h'(t)=1-\dfrac32t^2=0\ \Rightarrow\ t=\sqrt{\tfrac23}=\dfrac{\sqrt6}{3}\)</div><div class="calc purple">\(h\!\left(\tfrac{\sqrt6}{3}\right)=\dfrac{\sqrt6}{3}-\dfrac12\cdot\dfrac{2\sqrt6}{9}=\dfrac{\sqrt6}{3}-\dfrac{\sqrt6}{9}=\dfrac{2\sqrt6}{9}\)</div><p>다른 경우의 값은 \(0\) 이하이므로 이것이 최댓값.</p>`},
    {tag:'💡 꿀팁', title:R`\(\left(\frac{\sqrt6}{3}\right)^3\) 계산`, body:R`<div class="hint">📌 \(\left(\frac{\sqrt6}{3}\right)^3=\frac{6\sqrt6}{27}=\frac{2\sqrt6}{9}\). 루트 세제곱에서 실수가 잦다. 또 \(h(t)\)는 \(t^3\) 항 때문에 "\(t-\frac{t^3}{2}\)의 최대" = \(t\cdot\left(1-\frac{t^2}{2}\right)\)에서 \(t^2=\frac23\)이면 \(\frac{\sqrt6}{3}\cdot\frac23\)으로 빠르게 계산 가능.</div>`}
  ]
},
/* ───────────── 18 (수정 시행) ───────────── */
{
  id:'q18', level:'advanced', levelLabel:'문항', num:18, type:'choice',
  subLabel:'다항함수 결정 · 부등식 · 4.9점 · 수정 시행',
  title:R`조건을 만족시키는 모든 다항함수에서 \(f(-2)\)의 최솟값`,
  question:R`<p>다음 조건을 만족시키는 모든 다항함수 \(f(x)\)에 대하여 \(f(-2)\)의 최솟값은? <small>[4.9점]</small></p><div class="calc">(가) \(\displaystyle\lim_{x\to\infty}\dfrac{f(x)}{x^2}\)의 값이 존재하고, \(\displaystyle\lim_{x\to1}\dfrac{x^2-3x+2}{f(x)-1}=\dfrac12\)이다.<br>(나) 부등식 \(f(x)\lt \dfrac13\)을 만족시키는 실수 \(x\)는 존재하지 않는다.</div>
<!-- 1차 협의 후 수정본("최솟값") 기준. 원안("최댓값")은 정답 없음 오류였음. -->`,
  choices:[R`\(19\)`,R`\(\dfrac{39}{2}\)`,R`\(20\)`,R`\(\dfrac{41}{2}\)`,R`\(21\)`], answer:3, answerText:R`④ \(\dfrac{41}{2}\)`,
  keypoint:R`(가) 앞: 차수 \(\le2\). (가) 뒤: \(f(1)=1\), 미분계수 조건. (나): 이차함수의 최솟값 \(\ge\frac13\).`,
  steps:[
    {tag:'STEP 1', title:R`차수와 \(f(1)\)`, body:R`<p>\(\lim\frac{f(x)}{x^2}\) 존재 ⇒ \(f\)는 이차 이하. 분자 \(x^2-3x+2=(x-1)(x-2)\to0\)인데 극한값이 \(0\)이 아니므로 \(f(1)=1\).</p><div class="calc">\(f(x)-1=(x-1)q(x)\)</div>`},
    {tag:'STEP 2', title:R`\(q(1)\) 결정`, body:R`<div class="calc">\(\displaystyle\lim_{x\to1}\dfrac{x-2}{q(x)}=\dfrac{-1}{q(1)}=\dfrac12\ \Rightarrow\ q(1)=-2\)</div><p>\(q(x)=a(x-1)-2\)로 두면</p><div class="calc purple">\(f(x)=a(x-1)^2-2(x-1)+1\)</div>`},
    {tag:'STEP 3', title:R`(나) 적용`, body:R`<p>\(a\le0\)이면 \(f\)가 아래로 한없이 작아져 (나)에 모순. \(a\gt 0\)일 때 꼭짓점 \(x-1=\frac1a\)에서 최솟값</p><div class="calc">\(f_{\min}=\dfrac1a-\dfrac2a+1=1-\dfrac1a\ge\dfrac13\ \Rightarrow\ a\ge\dfrac32\)</div>`},
    {tag:'STEP 4', title:R`\(f(-2)\)의 최솟값`, body:R`<div class="calc">\(f(-2)=9a+6+1=9a+7\)</div><div class="calc purple">\(a=\tfrac32\)일 때 최소: \(\dfrac{27}{2}+7=\dfrac{41}{2}\)</div>`},
    {tag:'💡 꿀팁', title:R`\(x-1\) 기준으로 전개하기`, body:R`<div class="hint">📌 조건이 모두 \(x=1\) 중심이므로 \(f\)를 \(x\)가 아니라 <b>\((x-1)\)의 다항식</b>으로 쓰면 \(f(1)=1\), \(f'(1)=-2\)가 계수에 그대로 보인다. (사실 (가) 뒤 조건은 \(f'(1)=-2\)와 같다.)</div><div class="warn">⚠️ 원안의 "최댓값"은 \(a\)가 커질수록 \(f(-2)\)가 커지므로 존재하지 않았다. 시행본은 "최솟값"으로 수정.</div>`}
  ]
},
/* ───────────── 19 ───────────── */
{
  id:'q19', level:'advanced', levelLabel:'문항', num:19, type:'choice',
  subLabel:'항등식 · 극값 · 미분가능성 〈보기〉 · 5.1점',
  title:R`\(f(x)=f'(x)\cdot\frac{x-1}{4}+R(x)\)인 사차함수`,
  question:R`<p>최고차항의 계수가 \(1\)인 사차함수 \(f(x)\)와 그 도함수 \(f'(x)\), 이차 이하의 다항식 \(R(x)\)가 다음 조건을 만족시킨다. 〈보기〉에서 옳은 것만을 있는 대로 고른 것은? <small>[5.1점]</small></p><div class="calc">(가) \(f(x)=f'(x)\left(\dfrac{x-1}{4}\right)+R(x)\)<br>(나) \(f(0)=0\)이고, 함수 \(f(x)\)는 \(x=-1\)에서 극값 \(-3\)을 갖는다.</div><div class="calc">ㄱ. \(R(4)\)는 \(f(x)\)의 극댓값과 같다.<br>ㄴ. 함수 \(|f(x)|\)가 미분가능하지 않은 점의 개수는 \(2\)이다.<br>ㄷ. 닫힌구간 \([t,\,t+3]\)에서 함수 \(f(x)\)의 최솟값이 \(R(-1)\)이 되도록 하는 실수 \(t\)의 값의 범위는 \(-4\le t\le-1\)이다.</div>`,
  choices:[R`ㄱ`,R`ㄴ`,R`ㄱ, ㄷ`,R`ㄴ, ㄷ`,R`ㄱ, ㄴ, ㄷ`], answer:1, answerText:R`② ㄴ`,
  keypoint:R`(가)의 \(x^3\) 계수 비교로 \(f\)의 \(x^3\) 계수 결정. \(f'(k)=0\)인 점에서는 \(R(k)=f(k)\).`,
  steps:[
    {tag:'STEP 1', title:R`\(x^3\) 계수 비교`, body:R`<p>\(f(x)=x^4+px^3+\cdots\)이면 \(f'(x)\cdot\frac{x-1}{4}\)의 \(x^3\) 계수는 \(\frac{3p-4}{4}\). \(R\)은 이차 이하이므로</p><div class="calc">\(p=\dfrac{3p-4}{4}\ \Rightarrow\ p=-4\)</div>`},
    {tag:'STEP 2', title:R`\(f(x)\) 결정`, body:R`<p>\(f(x)=x^4-4x^3+bx^2+cx\) (\(f(0)=0\)).</p><div class="calc">\(f'(-1)=-4-12-2b+c=0,\quad f(-1)=5+b-c=-3\)</div><div class="calc purple">\(b=-8,\ c=0:\ f(x)=x^4-4x^3-8x^2,\quad f'(x)=4x(x+1)(x-4)\)</div><p>극소 \(f(-1)=-3\), 극대 \(f(0)=0\), 극소 \(f(4)=-128\). 또 \(R(x)=-7x^2-4x\).</p>`},
    {tag:'STEP 3', title:R`ㄱ`, body:R`<p>\(f'(4)=0\)이므로 \(R(4)=f(4)=-128\): <b>극솟값</b>. 극댓값은 \(0\). <b>ㄱ 거짓</b></p>`},
    {tag:'STEP 4', title:R`ㄴ`, body:R`<div class="calc">\(f(x)=x^2(x^2-4x-8)\)</div><p>\(x=0\)은 중근(부호 변화 없음, \(f'(0)=0\)) → \(|f|\) 미분가능. \(x=2\pm2\sqrt3\)은 단순근 → 미분불가. 개수 \(2\). <b>ㄴ 참</b></p>`},
    {tag:'STEP 5', title:R`ㄷ`, body:R`<p>\(R(-1)=f(-1)=-3\).</p><div class="calc">\(f(x)+3=(x+1)^2(x^2-6x+3)\ \Rightarrow\ f(x)\lt -3\iff 3-\sqrt6\lt x\lt 3+\sqrt6\)</div><p>최솟값이 \(-3\)이려면 구간이 \((3-\sqrt6,\,3+\sqrt6)\)과 겹치지 않으면서 \(f=-3\)인 점을 포함해야 한다.</p><div class="calc">왼쪽: \(t\le-1\) 그리고 \(t+3\le3-\sqrt6\ \Rightarrow\ -4\le t\le-\sqrt6\)<br>오른쪽: \(t=3+\sqrt6\) (구간 \([3+\sqrt6,\,6+\sqrt6]\)에서 \(f\) 증가)</div><div class="calc purple">\(-4\le t\le-1\)이 아니므로 ㄷ 거짓</div>`},
    {tag:'💡 꿀팁', title:R`(가)의 진짜 의미`, body:R`<div class="hint">📌 (가)에 \(f'(k)=0\)인 \(x=k\)를 넣으면 \(R(k)=f(k)\). 즉 \(R\)은 <b>세 극점을 모두 지나는 이차 이하 곡선</b>이다. ㄱ·ㄷ의 \(R(4)\), \(R(-1)\)은 각각 \(f(4)\), \(f(-1)\)로 바로 바뀐다.</div><div class="warn">⚠️ ㄷ에서 \(t=-1\)을 넣어 보면 구간 \([-1,2]\)에 \(f(2)=-32\lt -3\)이 들어가 최솟값이 \(-3\)이 아니다. 끝값 대입으로 빠르게 반례 확인!</div>`}
  ]
},
/* ───────────── 서답형 1 ───────────── */
{
  id:'s1', level:'kihul', levelLabel:'서답형', num:1, type:'short',
  subLabel:'극한과 이차함수 결정 · 4.7점',
  title:R`\(\lim f(x)/(x-1)=2\), \(f(0)=1\)`,
  question:R`<p>이차함수 \(f(x)\)가 \(\displaystyle\lim_{x\to1}\dfrac{f(x)}{x-1}=2\)를 만족시키고 \(f(0)=1\)일 때, \(f(2)\)의 값을 구하시오. <small>[4.7점]</small></p>`,
  answerText:R`\(5\)`,
  keypoint:R`분모 \(\to0\) ⇒ \(f(1)=0\) ⇒ \(f(x)=(x-1)(px+q)\).`,
  steps:[
    {tag:'STEP 1', title:R`인수 결정`, body:R`<p>극한값이 존재하고 분모 \(\to0\)이므로 \(f(1)=0\).</p><div class="calc">\(f(x)=(x-1)(px+q)\)</div>`},
    {tag:'STEP 2', title:R`조건 대입`, body:R`<div class="calc">\(\displaystyle\lim_{x\to1}(px+q)=p+q=2,\quad f(0)=-q=1\)</div><div class="calc">\(q=-1,\ p=3\ \Rightarrow\ f(x)=(x-1)(3x-1)\)</div><div class="calc purple">\(f(2)=1\cdot5=5\)</div>`},
    {tag:'💡 서술 포인트', title:R`채점 요소`, body:R`<div class="hint">📌 ① "분모 \(\to0\)이고 극한값이 존재하므로 분자 \(\to0\)" 문장 ② \(f(x)=(x-1)(px+q)\) 설정 ③ 연립 → \(f(2)=5\). ①의 근거 문장을 빠뜨리지 말 것.</div>`}
  ]
},
/* ───────────── 서답형 2 ───────────── */
{
  id:'s2', level:'kihul', levelLabel:'서답형', num:2, type:'short',
  subLabel:'∞−∞ 꼴 극한 · 유리화 · 4.9점',
  title:R`\(\lim(\sqrt{x^2+ax+1}-\sqrt{x^2+3x})=5\)`,
  question:R`<p>\(\displaystyle\lim_{x\to\infty}\left(\sqrt{x^2+ax+1}-\sqrt{x^2+3x}\right)=5\)일 때, 실수 \(a\)의 값을 구하시오. <small>[4.9점]</small></p>`,
  answerText:R`\(13\)`,
  keypoint:R`\(\infty-\infty\) 꼴은 분자 유리화 → 최고차항으로 나누기.`,
  steps:[
    {tag:'STEP 1', title:R`분자 유리화`, body:R`<div class="calc">\(\displaystyle\lim_{x\to\infty}\dfrac{(a-3)x+1}{\sqrt{x^2+ax+1}+\sqrt{x^2+3x}}\)</div>`},
    {tag:'STEP 2', title:R`\(x\)로 나누기`, body:R`<div class="calc">\(\displaystyle=\lim_{x\to\infty}\dfrac{(a-3)+\frac1x}{\sqrt{1+\frac ax+\frac1{x^2}}+\sqrt{1+\frac3x}}=\dfrac{a-3}{2}\)</div><div class="calc purple">\(\dfrac{a-3}{2}=5\ \Rightarrow\ a=13\)</div>`},
    {tag:'💡 꿀팁', title:R`검산 공식`, body:R`<div class="hint">📌 \(\sqrt{x^2+px+\cdots}-\sqrt{x^2+qx+\cdots}\to\dfrac{p-q}{2}\) (\(x\to\infty\)). 서술형에서는 유리화 과정을 반드시 쓰되, 답 검산은 이 공식으로.</div>`}
  ]
},
/* ───────────── 서답형 3 ───────────── */
{
  id:'s3', level:'kihul', levelLabel:'서답형', num:3, type:'short',
  subLabel:'나머지정리와 미분 · 5.1점',
  title:R`\(x^{100}+ax^2+bx+3\)을 \((x+1)^2\)으로 나눈 나머지`,
  question:R`<p>다항식 \(x^{100}+ax^2+bx+3\)을 \((x+1)^2\)으로 나누었을 때의 나머지가 \(2x-3\)일 때, \(a+b\)의 값을 구하시오. (단, \(a,b\)는 상수) <small>[5.1점]</small></p>`,
  answerText:R`\(-177\)`,
  keypoint:R`\((x-k)^2\)으로 나눈 나머지 ⇒ 항등식에 \(x=k\) 대입 + 양변 미분 후 \(x=k\) 대입.`,
  steps:[
    {tag:'STEP 1', title:R`항등식 세우기`, body:R`<div class="calc">\(x^{100}+ax^2+bx+3=(x+1)^2Q(x)+2x-3\)</div>`},
    {tag:'STEP 2', title:R`\(x=-1\) 대입`, body:R`<div class="calc">\(1+a-b+3=-5\ \Rightarrow\ a-b=-9\)</div>`},
    {tag:'STEP 3', title:R`미분 후 \(x=-1\) 대입`, body:R`<div class="calc">\(100x^{99}+2ax+b=2(x+1)Q(x)+(x+1)^2Q'(x)+2\)</div><div class="calc">\(-100-2a+b=2\ \Rightarrow\ -2a+b=102\)</div>`},
    {tag:'STEP 4', title:R`연립`, body:R`<p>두 식을 더하면 \(-a=93\).</p><div class="calc purple">\(a=-93,\ b=-84,\ a+b=-177\)</div>`},
    {tag:'💡 꿀팁', title:R`음수 답이어도 당황 금지`, body:R`<div class="hint">📌 \(x^{100}\)의 미분값 \(100x^{99}\)에서 \(x=-1\)이면 \(-100\) — 부호 실수가 가장 많은 지점. \((-1)^{99}=-1\), \((-1)^{100}=1\)을 먼저 써 두고 대입하자. 답 \(-177\)은 음수이지만 정상이다.</div>`}
  ]
},
/* ───────────── 서답형 4 ───────────── */
{
  id:'s4', level:'kihul', levelLabel:'서답형', num:4, type:'short',
  subLabel:'접선 · 평균값 정리 · 근의 개수 · 5.3점',
  title:R`\(\frac{f(t)}{t}=f'(c)\)를 만족시키는 \(c\)의 개수 \(N(t)\)`,
  question:R`<p>두 상수 \(p,q\)에 대하여 삼차함수 \(f(x)=x^3+px^2+qx\)는 곡선 \(y=f(x)\) 위의 점 \((1,f(1))\)에서의 접선이 곡선 \(y=f(x)\)와 점 \((4,f(4))\)에서 다시 만난다.</p><p>양수 \(t\)에 대하여 닫힌구간 \([0,t]\)에서 \(\dfrac{f(t)}{t}=f'(c)\)를 만족시키는 실수 \(c\,(0\lt c\lt t)\)의 개수를 \(N(t)\)라 하자. \(N(t)=2\)가 되도록 하는 \(t\)의 값의 범위가 \(\alpha\lt t\lt \beta\)일 때, \(\alpha+\beta\)의 값을 구하시오. <small>[5.3점]</small></p>`,
  answerText:R`\(9\)`,
  keypoint:R`접선과 곡선의 차 = \((x-1)^2(x-4)\). \(\frac{f(t)}{t}=\frac{f(t)-f(0)}{t-0}\)은 평균변화율 → 평균값 정리의 \(c\) 개수.`,
  steps:[
    {tag:'STEP 1', title:R`\(p\) 결정`, body:R`<p>\(f(x)-(\text{접선})=(x-1)^2(x-4)=x^3-6x^2+9x-4\). 접선은 일차식이므로 \(x^2\) 계수 비교:</p><div class="calc purple">\(p=-6\quad(q\text{는 결정되지 않음})\)</div>`},
    {tag:'STEP 2', title:R`방정식 세우기`, body:R`<div class="calc">\(\dfrac{f(t)}{t}=t^2-6t+q,\qquad f'(c)=3c^2-12c+q\)</div><div class="calc">\(3c^2-12c=t^2-6t\ \Rightarrow\ c=2\pm\sqrt{\dfrac{t^2-6t+12}{3}}\)</div><p>\(q\)는 소거된다. \(t^2-6t+12=(t-3)^2+3\gt 0\)이므로 실근은 항상 2개.</p>`},
    {tag:'STEP 3', title:R`\(0\lt c\lt t\) 조건`, body:R`<p>\(s=\sqrt{\frac{t^2-6t+12}{3}}\)라 하자.</p><div class="calc">작은 근 \(2-s\gt 0\iff s\lt 2\iff t^2-6t\lt 0\iff 0\lt t\lt 6\)<br>(\(2-s\lt t\)는 \(0\lt t\lt 6\)에서 항상 성립)<br>큰 근 \(2+s\lt t\iff s^2\lt (t-2)^2\iff 2t^2-6t\gt 0\iff t\gt 3\)</div>`},
    {tag:'STEP 4', title:R`\(N(t)=2\)`, body:R`<div class="calc">두 근 모두 유효 \(\iff 3\lt t\lt 6\)</div><div class="calc purple">\(\alpha+\beta=3+6=9\)</div>`},
    {tag:'💡 꿀팁', title:R`그래프로 보는 직관`, body:R`<div class="hint">📌 \(f'(c)=3c^2-12c+q\)는 \(c=2\)가 축인 포물선. \(f'(c)\)가 평균변화율 값과 같아지는 \(c\)가 \((0,t)\) 안에 몇 개냐는 문제다. 경계 \(t=3\)은 "큰 근 = \(t\)", \(t=6\)은 "작은 근 = \(0\)"인 순간 — 경계에서 \(c\)가 끝점에 닿는 \(t\)를 찾으면 빠르다.</div><div class="hint">📌 서술 채점 요소: ① \(p=-6\) 근거 ② \(q\) 소거 ③ 각 근의 유효 범위 ④ 교집합 \(3\lt t\lt 6\).</div>`}
  ]
}
];
