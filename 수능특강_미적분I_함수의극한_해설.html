<style id="site-css">/* ============================================================
   수능특강 미적분 I — 인터랙티브 해설 v2 (1학기 양식)
   태블릿 최적화 + 난이도 필터 + 인쇄 지원 + 풀이 공간 오버레이
   색상 톤: 보라 (purple/fuchsia)
   ============================================================ */

:root {
  --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
  --text-sm:   clamp(0.875rem, 0.8rem  + 0.35vw, 1rem);
  --text-base: clamp(1rem,     0.95rem + 0.25vw, 1.125rem);
  --text-lg:   clamp(1.125rem, 1rem    + 0.75vw, 1.5rem);
  --text-xl:   clamp(1.5rem,   1.2rem  + 1.25vw, 2.25rem);

  --space-1:0.25rem; --space-2:0.5rem;  --space-3:0.75rem; --space-4:1rem;
  --space-5:1.25rem; --space-6:1.5rem;  --space-8:2rem;    --space-10:2.5rem;

  --radius-sm:0.375rem; --radius-md:0.5rem; --radius-lg:0.75rem;
  --radius-xl:1rem;     --radius-full:9999px;

  --transition-fast: 150ms cubic-bezier(0.16,1,0.3,1);
  --transition-base: 220ms cubic-bezier(0.16,1,0.3,1);

  --font-display:'Noto Sans KR',sans-serif;
  --font-body:'Noto Sans KR',sans-serif;
  --font-math:Georgia,serif;

  --header-h: 116px;
  --footer-h: 64px;

  /* 난이도 색상 */
  --level-basic-bg:#fefce8;     --level-basic-text:#a16207;    --level-basic-border:#fde047;
  --level-example-bg:#faf5ff;   --level-example-text:#7e22ce;  --level-example-border:#e9d5ff;
  --level-exercise-bg:#f0fdf4;  --level-exercise-text:#15803d; --level-exercise-border:#bbf7d0;
  --level-standard-bg:#fff7ed;  --level-standard-text:#9a3412; --level-standard-border:#fed7aa;
  --level-advanced-bg:#fff1f2;  --level-advanced-text:#be123c; --level-advanced-border:#fecdd3;
  --level-kihul-bg:#fdf4ff;     --level-kihul-text:#86198f;    --level-kihul-border:#f5d0fe;
}

/* ── 라이트 ── */
:root,[data-theme="light"] {
  --color-bg:#faf5ff;         --color-surface:#ffffff;
  --color-surface-2:#fdf4ff;  --color-surface-offset:#f5edff;
  --color-border:#e9d5ff;     --color-divider:#f3e8ff;
  --color-text:#1a1a2e;       --color-text-muted:#6b21a8;
  --color-text-faint:#a78bfa; --color-text-inverse:#faf5ff;
  --color-primary:#a855f7;    --color-primary-hover:#9333ea;
  --color-primary-light:#e9d5ff; --color-primary-subtle:#f5edff;
  --color-blue-bg:#eff6ff;    --color-blue-border:#bfdbfe;  --color-blue-text:#1d4ed8;
  --color-green-bg:#f0fdf4;   --color-green-border:#bbf7d0; --color-green-text:#15803d;
  --color-yellow-bg:#fefce8;  --color-yellow-border:#fde047;--color-yellow-text:#a16207;
  --color-red-bg:#fef2f2;     --color-red-border:#fecaca;   --color-red-text:#b91c1c;
  --color-success:#7e22ce;    --color-success-bg:#faf5ff;
  --color-answer-bg:#faf5ff;  --color-answer-border:#d8b4fe;--color-answer-text:#581c87;
  --shadow-sm:0 1px 3px rgba(80,40,130,.06);
  --shadow-md:0 4px 16px rgba(80,40,130,.09);
  --shadow-lg:0 12px 40px rgba(80,40,130,.13);
}

/* ── 다크 ── */
[data-theme="dark"] {
  --color-bg:#1a1326;         --color-surface:#241834;
  --color-surface-2:#2b1d3f;  --color-surface-offset:#291a3c;
  --color-border:#412a5e;     --color-divider:#3a2552;
  --color-text:#f3e8ff;       --color-text-muted:#b794d8;
  --color-text-faint:#6b4587; --color-text-inverse:#1a1326;
  --color-primary:#c084fc;    --color-primary-hover:#d8b4fe;
  --color-primary-light:#5b2188; --color-primary-subtle:#2d1846;
  --color-blue-bg:#172040;    --color-blue-border:#1d4ed8;  --color-blue-text:#93c5fd;
  --color-green-bg:#052e16;   --color-green-border:#166534; --color-green-text:#86efac;
  --color-yellow-bg:#1c1505;  --color-yellow-border:#854d0e;--color-yellow-text:#fde047;
  --color-red-bg:#1c0505;     --color-red-border:#991b1b;   --color-red-text:#fca5a5;
  --color-success:#d8b4fe;    --color-success-bg:#2d1846;
  --color-answer-bg:#2d1846;  --color-answer-border:#7e22ce;--color-answer-text:#d8b4fe;
  --shadow-sm:0 1px 3px rgba(0,0,0,.25);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,.45);
  /* 다크 난이도 */
  --level-basic-bg:#1c1505;     --level-basic-text:#fde047;    --level-basic-border:#854d0e;
  --level-example-bg:#2e1065;   --level-example-text:#d8b4fe;  --level-example-border:#7e22ce;
  --level-exercise-bg:#052e16;  --level-exercise-text:#86efac; --level-exercise-border:#166534;
  --level-standard-bg:#1c1005;  --level-standard-text:#fed7aa; --level-standard-border:#9a3412;
  --level-advanced-bg:#1c0505;  --level-advanced-text:#fda4af; --level-advanced-border:#be123c;
  --level-kihul-bg:#2e0a3f;     --level-kihul-text:#f0abfc;    --level-kihul-border:#86198f;
}

/* ── 리셋 ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);
  background:var(--color-bg);overflow-x:hidden;
  padding-top:var(--header-h);padding-bottom:var(--footer-h);
  opacity:0;transition:opacity 0.3s;line-height:1.7}
body.mathjax-ready{opacity:1}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit}
a{color:var(--color-primary);text-decoration:none}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:3px;border-radius:var(--radius-sm)}

/* ══════════════════════════════════
   HEADER
══════════════════════════════════ */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
  box-shadow:var(--shadow-sm);
}
.header-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-3) var(--space-6);gap:var(--space-4);
}
.header-title{display:flex;align-items:center;gap:var(--space-3)}
.logo-icon{width:34px;height:34px;flex-shrink:0}
.school-name{font-size:var(--text-xs);font-weight:500;color:var(--color-text-muted);
  letter-spacing:.04em;display:block;line-height:1.2}
.site-title{font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;
  color:var(--color-text);line-height:1.2;white-space:nowrap}
.unit-name{color:var(--color-primary)}
.header-controls{display:flex;align-items:center;gap:var(--space-3);flex-shrink:0}
.progress-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-1)}
.progress-label{font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);font-variant-numeric:tabular-nums}
.progress-bar-track{width:80px;height:5px;background:var(--color-surface-offset);border-radius:var(--radius-full);overflow:hidden}
.progress-bar-fill{height:100%;background:var(--color-primary);border-radius:var(--radius-full);transition:width 350ms ease}
.btn-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-full);color:var(--color-text-muted);
  background:var(--color-surface-offset);border:1px solid var(--color-border);
  transition:all var(--transition-fast)}
.btn-icon:hover{background:var(--color-primary-subtle);color:var(--color-primary);border-color:var(--color-primary-light)}

/* ── 난이도 필터 바 ── */
.filter-bar{
  display:flex;gap:var(--space-2);padding:var(--space-2) var(--space-6) var(--space-3);
  overflow-x:auto;scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{
  display:inline-flex;align-items:center;gap:var(--space-1);
  padding:var(--space-1) var(--space-4);border-radius:var(--radius-full);
  font-size:var(--text-sm);font-weight:600;font-family:var(--font-display);
  color:var(--color-text-muted);background:var(--color-surface-offset);
  border:1.5px solid var(--color-border);white-space:nowrap;min-height:34px;
  transition:all var(--transition-fast);
}
.filter-btn:hover{background:var(--color-primary-subtle);color:var(--color-primary);border-color:var(--color-primary-light)}
.filter-btn.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.filter-count{
  font-size:var(--text-xs);font-weight:700;
  background:rgba(255,255,255,0.25);border-radius:var(--radius-full);
  padding:0 6px;min-width:20px;text-align:center;
}
.filter-btn:not(.active) .filter-count{background:var(--color-surface-2);color:var(--color-text-muted)}

/* 필터별 액티브 색 */
.filter-btn[data-filter="basic"].active    {background:var(--level-basic-text);border-color:var(--level-basic-text)}
.filter-btn[data-filter="example"].active  {background:var(--level-example-text);border-color:var(--level-example-text)}
.filter-btn[data-filter="exercise"].active {background:var(--level-exercise-text);border-color:var(--level-exercise-text)}
.filter-btn[data-filter="standard"].active {background:var(--level-standard-text);border-color:var(--level-standard-text)}
.filter-btn[data-filter="advanced"].active {background:var(--level-advanced-text);border-color:var(--level-advanced-text)}
.filter-btn[data-filter="kihul"].active    {background:var(--level-kihul-text);border-color:var(--level-kihul-text)}

/* ══════════════════════════════════
   MAIN AREA
══════════════════════════════════ */
.main-area{
  padding:var(--space-5) var(--space-5) var(--space-8);
}
.card-viewport{max-width:900px;margin:0 auto}

/* ── 문항 카드 ── */
.problem-card{animation:cardIn 280ms cubic-bezier(0.16,1,0.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-inner{display:flex;flex-direction:column;gap:var(--space-5)}

/* ── 문제 섹션 ── */
.problem-section{
  background:var(--color-surface);border:1.5px solid var(--color-border);
  border-radius:var(--radius-xl);padding:var(--space-6);box-shadow:var(--shadow-sm);
}
.problem-badge{
  display:inline-flex;align-items:center;
  font-family:var(--font-display);font-size:var(--text-sm);font-weight:700;
  border:1.5px solid;border-radius:var(--radius-full);
  padding:var(--space-1) var(--space-4);margin-bottom:var(--space-4);letter-spacing:.03em;
}
.problem-sub-label{
  display:inline-block;margin-left:var(--space-2);
  font-size:var(--text-xs);color:var(--color-text-faint);font-weight:500;
}
.problem-title{
  font-size:var(--text-lg);font-weight:800;color:var(--color-text);
  margin-bottom:var(--space-3);line-height:1.4;
}
.problem-statement{
  font-size:clamp(1.05rem,1rem + 0.6vw,1.35rem);font-weight:500;
  line-height:1.8;color:var(--color-text);margin-bottom:var(--space-3);max-width:none;
}
.problem-statement p{margin:0.4rem 0}
.choices{
  list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-2);
  margin-top:var(--space-3);
}
.choices li{
  padding:var(--space-3) var(--space-2);border:1.5px solid var(--color-border);
  border-radius:var(--radius-md);font-size:var(--text-sm);text-align:center;
  background:var(--color-surface-2);color:var(--color-text-muted);
  line-height:1.6;max-width:none;transition:all var(--transition-fast);
}
.short-answer-label{
  display:inline-flex;font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);
  background:var(--color-surface-offset);border:1px solid var(--color-border);
  border-radius:var(--radius-full);padding:var(--space-1) var(--space-3);margin-top:var(--space-3);
}
.graph-box{display:flex;justify-content:center;padding:var(--space-3) 0}
.graph-box svg{max-width:100%;height:auto}

/* ── 풀이 공간 ── */
.scratch-area{
  position:relative;min-height:120px;
  background-image:linear-gradient(var(--color-divider) 1px,transparent 1px),
                   linear-gradient(90deg,var(--color-divider) 1px,transparent 1px);
  background-size:28px 28px;background-color:var(--color-surface);
  border:1.5px dashed var(--color-border);border-radius:var(--radius-xl);overflow:hidden;
  cursor:pointer;transition:border-color var(--transition-fast), box-shadow var(--transition-fast);
}
.scratch-area:hover{
  border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-subtle);
}
.scratch-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:var(--text-sm);font-weight:600;color:var(--color-text-faint);
  letter-spacing:.06em;pointer-events:none;display:flex;flex-direction:column;
  align-items:center;gap:var(--space-2);text-align:center;
}
.scratch-label::after{
  content:'터치하여 넓히기';
  font-size:var(--text-xs);color:var(--color-text-faint);opacity:.7;
}

/* ── 풀이 공간 오버레이 ── */
.scratch-overlay{
  position:fixed;inset:0;z-index:500;
  background:var(--color-bg);
  display:flex;flex-direction:column;
  animation:overlayIn 220ms cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes overlayIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
.scratch-overlay-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-4) var(--space-6);
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
  flex-shrink:0;
}
.scratch-overlay-title{
  font-family:var(--font-display);font-size:var(--text-base);font-weight:700;
  color:var(--color-text-muted);letter-spacing:.05em;text-transform:uppercase;
}
.scratch-overlay-close{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius-full);background:var(--color-surface-offset);
  border:1.5px solid var(--color-border);color:var(--color-text-muted);
  font-size:1.4rem;line-height:1;cursor:pointer;
  transition:all var(--transition-fast);
}
.scratch-overlay-close:hover{
  background:var(--color-red-bg);color:var(--color-red-text);border-color:var(--color-red-border);
}
.scratch-overlay-body{display:flex;flex:1;min-height:0}
.scratch-overlay-problem{
  width:38%;max-width:520px;min-width:300px;
  overflow-y:auto;padding:var(--space-5) var(--space-6);
  border-right:1px solid var(--color-border);
  background:var(--color-surface);
}
.scratch-overlay-problem .problem-badge{margin-bottom:var(--space-3)}
.scratch-overlay-problem .problem-statement{
  font-size:var(--text-base);line-height:1.65;color:var(--color-text);
  margin:0 0 var(--space-4)
}
.scratch-overlay-problem .choices{margin-top:var(--space-3)}
@media (max-width:768px){
  .scratch-overlay-body{flex-direction:column}
  .scratch-overlay-problem{
    width:100%;max-width:none;min-width:0;max-height:38vh;
    border-right:none;border-bottom:1px solid var(--color-border)
  }
}
.scratch-overlay-canvas{
  flex:1;min-width:0;display:flex;flex-direction:column;
  background-color:var(--color-surface);
}
.overlay-step-bar{
  display:flex;flex-wrap:wrap;gap:var(--space-2);
  padding:var(--space-3) var(--space-4);
  border-bottom:1px solid var(--color-border);
  background:var(--color-surface-offset);flex-shrink:0;
}
.overlay-step-bar .step-btn{flex:0 0 auto}
.overlay-steps-container{
  flex:1;min-height:0;overflow-y:auto;
  padding:var(--space-4) var(--space-5);
  background-image:linear-gradient(var(--color-divider) 1px,transparent 1px),
                   linear-gradient(90deg,var(--color-divider) 1px,transparent 1px);
  background-size:32px 32px;
}
.overlay-steps-container .step{margin-bottom:var(--space-4)}
.overlay-steps-container .step:last-child{margin-bottom:0}
.overlay-nav{
  display:flex;align-items:center;gap:var(--space-2);
  margin-left:auto;margin-right:var(--space-3);
}
.overlay-nav-btn{
  padding:var(--space-2) var(--space-3);
  background:var(--color-surface-offset);
  border:1.5px solid var(--color-border);
  border-radius:var(--radius-md);
  font-size:var(--text-sm);font-weight:600;
  color:var(--color-text-muted);cursor:pointer;
  transition:all var(--transition-fast);
}
.overlay-nav-btn:hover:not(:disabled){
  background:var(--color-primary-subtle);color:var(--color-primary);
  border-color:var(--color-primary-light);
}
.overlay-nav-btn:disabled{opacity:.35;cursor:not-allowed}
.overlay-nav-label{
  font-size:var(--text-sm);color:var(--color-text-muted);
  font-weight:600;min-width:54px;text-align:center;
}

/* ── 해설 섹션 ── */
.solution-section{
  background:var(--color-surface);border:1.5px solid var(--color-border);
  border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-sm);
}
.solution-toggle-bar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);
  padding:var(--space-4) var(--space-6);background:var(--color-surface-offset);
  border-bottom:1px solid var(--color-border);
}
.solution-title{
  font-family:var(--font-display);font-size:var(--text-sm);font-weight:700;
  color:var(--color-text-muted);letter-spacing:.05em;text-transform:uppercase;
}
.step-buttons{display:flex;gap:var(--space-2);flex-wrap:wrap}
.step-btn{
  padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);
  font-size:var(--text-sm);font-weight:600;font-family:var(--font-display);
  color:var(--color-text-muted);background:var(--color-surface);
  border:1.5px solid var(--color-border);transition:all var(--transition-fast);
  min-height:40px;min-width:78px;
}
.step-btn:hover{background:var(--color-primary-subtle);color:var(--color-primary);border-color:var(--color-primary-light)}
.step-btn.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.reset-btn{color:var(--color-text-faint);border-style:dashed}
.reset-btn:hover{background:var(--color-red-bg);color:var(--color-red-text);border-color:var(--color-red-border);border-style:solid}
.answer-btn{color:var(--color-success);border-color:var(--color-answer-border)}
.answer-btn:hover{background:var(--color-answer-bg);color:var(--color-answer-text);border-color:var(--color-success)}
.answer-btn.active{background:var(--color-success);color:#fff;border-color:var(--color-success)}
.steps-container{padding:var(--space-5) var(--space-6);display:flex;flex-direction:column;gap:var(--space-5);min-height:60px}

/* ── STEP 카드 ── */
.step{animation:stepReveal 280ms cubic-bezier(0.16,1,0.3,1) both}
@keyframes stepReveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.step-header{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.step-tag{
  display:inline-flex;align-items:center;justify-content:center;
  padding:.15em var(--space-3);border-radius:var(--radius-full);
  font-family:var(--font-display);font-size:var(--text-xs);font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;background:var(--color-primary);color:#fff;flex-shrink:0;
}
.step-title{font-size:var(--text-base);font-weight:600;color:var(--color-text)}
.step-body{padding-left:calc(var(--space-3) + 2px);border-left:3px solid var(--color-primary-light)}
.step-body p{margin:0.5rem 0;line-height:1.7;color:var(--color-text-muted);font-size:var(--text-base)}
.step-body b{color:var(--color-text);font-weight:700}

/* ── 계산 박스 ── */
.calc{
  background:var(--color-surface-2);border:1px dashed var(--color-border);
  border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);
  margin:var(--space-2) 0;font-size:var(--text-base);line-height:1.8;
  color:var(--color-text);overflow-x:auto;
}
.calc.purple{
  background:var(--color-primary-subtle);border:1px solid var(--color-primary-light);
  color:var(--color-text);font-weight:500;
}

/* ── 힌트/경고 박스 ── */
.hint{
  background:var(--color-yellow-bg);border-left:4px solid var(--color-yellow-border);
  padding:var(--space-3) var(--space-4);border-radius:0 var(--radius-md) var(--radius-md) 0;
  margin:var(--space-3) 0;font-size:var(--text-sm);color:var(--color-yellow-text);line-height:1.7;
}
.warn{
  background:var(--color-red-bg);border-left:4px solid var(--color-red-border);
  padding:var(--space-3) var(--space-4);border-radius:0 var(--radius-md) var(--radius-md) 0;
  margin:var(--space-3) 0;font-size:var(--text-sm);color:var(--color-red-text);line-height:1.7;
}

/* ── 정답 표시 ── */
.answer-reveal{
  display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-5);
  padding:var(--space-4) var(--space-5);
  background:var(--color-answer-bg);border:2px solid var(--color-answer-border);border-radius:var(--radius-lg);
}
.answer-label{
  font-size:var(--text-xs);font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--color-success);font-family:var(--font-display);flex-shrink:0;
}
.answer-number{font-size:var(--text-xl);font-weight:700;color:var(--color-answer-text);font-family:var(--font-math)}

/* ── 정답 선지 강조 (revealed) — 정답 클릭 시 active ── */
.correct-choice.revealed{
  position:relative;
  background:linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%) !important;
  border:3px solid #10b981 !important;
  color:#064e3b !important;
  font-weight:800 !important;
  padding-left:2.75rem !important;
  box-shadow:0 0 0 4px rgba(16,185,129,0.18), 0 6px 14px rgba(16,185,129,0.22);
  animation:correctPulse 0.55s ease-out;
}
.correct-choice.revealed::before{
  content:'✓';position:absolute;left:0.6rem;top:50%;transform:translateY(-50%);
  width:1.6rem;height:1.6rem;background:#10b981;color:#fff;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:1rem;font-weight:900;box-shadow:0 2px 4px rgba(16,185,129,0.4);
}
@keyframes correctPulse{
  0%{transform:scale(1);box-shadow:0 0 0 0 rgba(16,185,129,0.55)}
  50%{transform:scale(1.015);box-shadow:0 0 0 14px rgba(16,185,129,0)}
  100%{transform:scale(1);box-shadow:0 0 0 4px rgba(16,185,129,0.18), 0 6px 14px rgba(16,185,129,0.22)}
}
[data-theme="dark"] .correct-choice.revealed{
  background:linear-gradient(135deg, #064e3b 0%, #065f46 100%) !important;
  border-color:#34d399 !important;color:#d1fae5 !important;
}
[data-theme="dark"] .correct-choice.revealed::before{background:#34d399;color:#064e3b}

/* ── 핵심 개념 (key-concept) ── */
.key-concept{
  display:flex;align-items:flex-start;flex-wrap:wrap;gap:var(--space-3);
  margin-top:var(--space-4);padding:var(--space-3) var(--space-4);
  background:linear-gradient(135deg, #ecfdf5 0%, #f0fdfa 100%);
  border:1px solid #99f6e4;border-left:4px solid #14b8a6;
  border-radius:var(--radius-md);font-size:var(--text-base);color:#134e4a;
  line-height:1.7;max-width:none;
}
[data-theme="dark"] .key-concept{
  background:#042f2e;color:#5eead4;border-color:#0f766e;border-left-color:#14b8a6;
}
.concept-label{
  font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:#0f766e;color:#fff;padding:.1em var(--space-2);
  border-radius:var(--radius-sm);flex-shrink:0;
}

/* ══════════════════════════════════
   BOTTOM NAV
══════════════════════════════════ */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;

}
.nav-btn:hover{background:var(--color-primary-hover);transform:translateY(-1px)}
.nav-btn:active{transform:translateY(0)}
.nav-btn:disabled{background:var(--color-surface-offset);color:var(--color-text-faint);box-shadow:none;cursor:not-allowed;transform:none}
.problem-counter{flex:1;text-align:center;font-family:var(--font-display);font-size:var(--text-lg);font-weight:700;color:var(--color-text);font-variant-numeric:tabular-nums}

══════════════════════════════════ */

.modal-sub-label{font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);margin:0 0 var(--space-1)}

      {tag:'STEP 1', title:'좌·우극한 각각 식으로 표현', body:`<p>\\(x\\lt 1\\)에서는 \\(-x+a\\), \\(x\\geq 1\\)에서는 \\(x^2+2a\\)이므로</p>
<div class="calc purple">\\(\\displaystyle \\lim_{x\\to 1-} f(x) = -1+a,\\quad \\lim_{x\\to 1+} f(x) = 1+2a\\)</div>`},
      {tag:'STEP 2', title:'차 = 3 방정식', body:`<div class="calc">\\((-1+a) - (1+2a) = -2 - a = 3\\)</div>
<div class="calc purple">\\(a = -5\\)</div>`},
      {tag:'STEP 3', title:'\\(f(1)\\) 계산 (위쪽 식 사용)', body:`<p>\\(x=1\\)은 \\(x\\geq 1\\) 영역이므로 \\(f(1)=1+2a\\).</p>
<div class="calc purple">\\(f(1) = 1 + 2(-5) = -9\\)</div>`}
    ]
  },

<div class="calc purple">\\(\\displaystyle \\lim_{x\\to -1-} f(x+2) = \\lim_{s\\to 1-} f(s) = 0\\)</div>`},
      {tag:'STEP 2', title:'\\(\\displaystyle \\lim_{x\\to 1+} f(-x)\\) — 치환 \\(t=-x\\)', body:`<p>\\(x\\to 1+\\) 이면 \\(t=-x \\to -1-\\) (부호 반전 + 방향 반전).</p>
<div class="calc purple">\\(\\displaystyle \\lim_{x\\to 1+} f(-x) = \\lim_{t\\to -1-} f(t) = -1\\)</div>`},
      {tag:'STEP 3', title:'합', body:`<div class="calc purple">\\(0 + (-1) = -1\\)</div>
<div class="hint">⚠️ \\(f(-x)\\)에서 \\(x\\to 1+\\)일 때 \\(-x\\to -1\\)이지만, <b>방향</b>은 \\(-1-\\)임을 놓치면 안 됨. 그래프상 \\(-1\\)의 "왼쪽"값을 읽어야 한다.</div>`}
    ]
  },

  /* ───────── 예제 2 ───────── */
  {
    id:'c1-e2', level:'example', levelLabel:'예제', num:2, type:'short',
    subLabel:'함수의 극한에 대한 성질 · 곱·합 분리',
    title:'\\(f(x)g(x)=4\\), \\((f+g)/f=3\\)에서 \\(f^2+g^2\\)',
    question:`<p>두 함수 \\(f(x)\\), \\(g(x)\\)가 \\(\\displaystyle \\lim_{x\\to 1} f(x)g(x)=4,\\ \\lim_{x\\to 1} \\dfrac{f(x)+g(x)}{f(x)}=3\\) 을 만족시킬 때, \\(\\displaystyle \\lim_{x\\to 1}\\bigl\\{ (f(x))^2 + (g(x))^2 \\bigr\\}\\)의 값을 구하시오.</p>`,
    answerText:'\\(10\\)',
    keypoint:'개별 \\(\\lim f\\), \\(\\lim g\\)를 몰라도 <b>비율과 곱</b>의 극한만으로 다양한 식을 합성할 수 있다.',
    steps:[
      {tag:'STEP 1', title:'\\(\\dfrac{g}{f}\\)의 극한 분리', body:`<p>\\(\\dfrac{f+g}{f} = 1 + \\dfrac{g}{f}\\) 이므로 \\(\\displaystyle \\lim_{x\\to 1}\\dfrac{g(x)}{f(x)} = 3 - 1 = 2\\).</p>
<div class="calc purple">\\(\\displaystyle \\lim_{x\\to 1}\\dfrac{g(x)}{f(x)} = 2\\)</div>`},
      {tag:'STEP 2', title:'역수로 \\(\\dfrac{f}{g}\\)의 극한', body:`<p>\\(\\displaystyle \\lim\\dfrac{g}{f}=2\\neq 0\\)이므로 역수의 극한값도 존재.</p>
<div class="calc purple">\\(\\displaystyle \\lim_{x\\to 1}\\dfrac{f(x)}{g(x)} = \\dfrac{1}{2}\\)</div>`},
      {tag:'STEP 3', title:'\\(f^2+g^2\\)를 \\((fg)\\)와 비율로 분해', body:`<p>핵심 변형: \\(f^2 + g^2 = \\dfrac{f}{g}\\cdot fg + \\dfrac{g}{f}\\cdot fg\\)</p>
<div class="calc">\\(= \\left(\\dfrac{f}{g} + \\dfrac{g}{f}\\right) \\cdot fg\\)</div>`},
      {tag:'STEP 4', title:'대입해서 최종 계산', body:`<div class="calc purple">\\(\\displaystyle \\lim_{x\\to 1}(f^2+g^2) = \\left(\\dfrac{1}{2}+2\\right)\\cdot 4 = \\dfrac{5}{2}\\cdot 4 = 10\\)</div>`}
    ]
  },

  /* ───────── 유제 3 ───────── */
  {
    id:'c1-ex3', level:'exercise', levelLabel:'유제', num:3, type:'choice',
    subLabel:'[26009-0003] · 극한 성질 — 합·곱 결합',
    title:'\\(f+g=6\\), \\(f^2+fg=12\\)에서 \\(f-g\\)',
    question:`<p>두 함수 \\(f(x)\\), \\(g(x)\\)가 \\(\\displaystyle \\lim_{x\\to 2} (f+g)=6,\\ \\lim_{x\\to 2}\\{f^2+fg\\}=12\\) 를 만족시킬 때, \\(\\displaystyle \\lim_{x\\to 2}(f-g)\\)의 값은?</p>`,
    choices:['\\(-2\\)','\\(-1\\)','\\(0\\)','\\(1\\)','\\(2\\)'], answer:0,
    keypoint:'합·곱이 다 주어졌으면 "인수분해"로 한 변수만 분리하는 것이 정석.',
    steps:[
      {tag:'STEP 1', title:'\\(f^2+fg = f(f+g)\\)로 묶기', body:`<div class="calc">\\(f^2+fg = f(f+g)\\)</div>
<div class="calc purple">\\(\\displaystyle \\lim f = \\dfrac{\\lim f(f+g)}{\\lim (f+g)} = \\dfrac{12}{6} = 2\\)</div>`},
      {tag:'STEP 2', title:'\\(\\lim g\\) 계산', body:`<div class="calc purple">\\(\\lim g = \\lim(f+g) - \\lim f = 6 - 2 = 4\\)</div>`},
      {tag:'STEP 3', title:'\\(f-g\\)의 극한', body:`<div class="calc purple">\\(\\lim (f-g) = 2 - 4 = -2\\)</div>`}
    ]
  },

  /* ───────── 유제 4 ───────── */
  {
    id:'c1-ex4', level:'exercise', levelLabel:'유제', num:4, type:'short',
    subLabel:'[26009-0004] · (x+1)f(x) 결합 분해 (서답형)',
    title:'결합 분해로 \\(fg + (x^2+3x+2)f\\)',
    question:`<p>두 함수 \\(f(x)\\), \\(g(x)\\)가 \\(\\displaystyle \\lim_{x\\to -1}(x+1)f(x)=2,\\ \\lim_{x\\to -1}\\Big\\{\\dfrac{g(x)}{x+1}+3x\\Big\\}=8\\) 를 만족시킬 때, \\(\\displaystyle \\lim_{x\\to -1}\\bigl\\{f(x)g(x) + (x^2+3x+2)f(x)\\bigr\\}\\)의 값을 구하시오.</p>`,
    answerText:'\\(24\\)',
    keypoint:'"공통 인수 \\((x+1)\\)"를 찾아서 \\(0\\cdot \\infty\\) 형태를 두 개의 유한 극한의 곱으로 분리.',
    steps:[
      {tag:'STEP 1', title:'\\(\\dfrac{g(x)}{x+1}\\)의 극한 분리', body:`<div class="calc">\\(\\dfrac{g(x)}{x+1} = \\left\\{\\dfrac{g(x)}{x+1}+3x\\right\\} - 3x\\)</div>
<div class="calc purple">\\(\\displaystyle \\lim_{x\\to -1}\\dfrac{g(x)}{x+1} = 8 - (-3) = 11\\)</div>`},
      {tag:'STEP 2', title:'\\(fg\\)를 \\([(x+1)f]\\cdot[g/(x+1)]\\)로 묶기', body:`<div class="calc">\\(f(x)g(x) = (x+1)f(x) \\cdot \\dfrac{g(x)}{x+1}\\)</div>
<div class="calc purple">\\(\\lim fg = 2 \\cdot 11 = 22\\)</div>`},
      {tag:'STEP 3', title:'\\((x^2+3x+2)f\\) 분해', body:`<p>\\(x^2+3x+2 = (x+1)(x+2)\\) 이므로</p>
<div class="calc">\\((x^2+3x+2)f(x) = (x+1)f(x) \\cdot (x+2)\\)</div>
<div class="calc purple">\\(\\lim = 2 \\cdot 1 = 2\\)</div>`},
      {tag:'STEP 4', title:'최종 합', body:`<div class="calc purple">\\(22 + 2 = 24\\)</div>`}
    ]
  },

  /* ───────── 예제 3 ───────── */
  {
    id:'c1-e3', level:'example', levelLabel:'예제', num:3, type:'choice',
    subLabel:'0/0 꼴 · 유리화 + 인수분해',
    title:'\\(\\displaystyle \\lim_{x\\to 3}\\dfrac{x^2-2x-3}{\\sqrt{x+6}-3}\\)',
    question:`<p>\\(\\displaystyle \\lim_{x\\to 3} \\dfrac{x^2-2x-3}{\\sqrt{x+6}-3}\\)의 값은?</p>`,
    choices:['\\(12\\)','\\(16\\)','\\(20\\)','\\(24\\)','\\(28\\)'], answer:3,
    keypoint:'분모·분자 모두 \\(0\\)이면 → (다항)은 인수분해, (무리식)은 유리화. 약분 후 대입.',
    steps:[
      {tag:'STEP 1', title:'분모를 유리화 — \\(\\sqrt{x+6}+3\\)을 곱하기', body:`<div class="calc">\\(\\dfrac{(x^2-2x-3)(\\sqrt{x+6}+3)}{(\\sqrt{x+6}-3)(\\sqrt{x+6}+3)} = \\dfrac{(x^2-2x-3)(\\sqrt{x+6}+3)}{(x+6)-9}\\)</div>
<div class="calc purple">\\(= \\dfrac{(x^2-2x-3)(\\sqrt{x+6}+3)}{x-3}\\)</div>`},
      {tag:'STEP 2', title:'분자 인수분해 + 약분', body:`<div class="calc">\\(x^2-2x-3 = (x+1)(x-3)\\)</div>
<div class="calc purple">\\(\\dfrac{(x+1)(x-3)(\\sqrt{x+6}+3)}{x-3} = (x+1)(\\sqrt{x+6}+3)\\)</div>`},
      {tag:'STEP 3', title:'\\(x\\to 3\\) 대입', body:`<div class="calc purple">\\(= 4 \\cdot (\\sqrt{9}+3) = 4 \\cdot 6 = 24\\)</div>`}

  /* ───────── 유제 5 ───────── */
  {
    id:'c1-ex5', level:'exercise', levelLabel:'유제', num:5, type:'choice',
    subLabel:'[26009-0005] · \\(\\dfrac{1}{x}\\) 통분 + 약분',
    title:'\\(\\dfrac{1}{x}\\bigl[\\dfrac{1}{2} + \\dfrac{x-4}{(x+2)^3}\\bigr]\\)',
    question:`<p>\\(\\displaystyle \\lim_{x\\to 0} \\dfrac{1}{x}\\left[\\dfrac{1}{2} + \\dfrac{x-4}{(x+2)^3}\\right]\\)의 값은?</p>`,
    choices:['\\(\\dfrac{3}{8}\\)','\\(\\dfrac{1}{2}\\)','\\(\\dfrac{5}{8}\\)','\\(\\dfrac{3}{4}\\)','\\(\\dfrac{7}{8}\\)'], answer:4,
    keypoint:'\\(0\\cdot \\infty\\) 꼴 — 통분 후 분자에서 "\\(x\\) 인수"가 빠져나오는지 확인이 핵심.',
    steps:[
      {tag:'STEP 1', title:'대괄호 안 통분', body:`<div class="calc">\\(\\dfrac{1}{2} + \\dfrac{x-4}{(x+2)^3} = \\dfrac{(x+2)^3 + 2(x-4)}{2(x+2)^3}\\)</div>`},
      {tag:'STEP 2', title:'분자 전개 — \\(x\\) 인수 확보가 관건', body:`<p>\\((x+2)^3 = x^3+6x^2+12x+8\\) 이므로</p>
<div class="calc">분자 \\(= x^3+6x^2+12x+8 + 2x - 8 = x^3+6x^2+14x\\)</div>
<div class="calc purple">\\(= x(x^2+6x+14)\\)</div>`},
      {tag:'STEP 3', title:'\\(\\dfrac{1}{x}\\)와 약분 후 \\(x\\to 0\\) 대입', body:`<div class="calc">전체 \\(= \\dfrac{1}{x}\\cdot\\dfrac{x(x^2+6x+14)}{2(x+2)^3} = \\dfrac{x^2+6x+14}{2(x+2)^3}\\)</div>
<div class="calc purple">\\(\\to \\dfrac{14}{2\\cdot 8} = \\dfrac{7}{8}\\)</div>`}
    ]

    title:'\\(\\displaystyle \\lim_{x\\to -\\infty} \\dfrac{\\sqrt{4x^2+3x}-2x}{x+4}\\)',
    question:`<p>\\(\\displaystyle \\lim_{x\\to -\\infty} \\dfrac{\\sqrt{4x^2+3x}-2x}{x+4}\\)의 값은?</p>`,
    choices:['\\(-5\\)','\\(-4\\)','\\(-3\\)','\\(-2\\)','\\(-1\\)'], answer:1,
    keypoint:'\\(x\\to -\\infty\\) 무리식은 \\(t=-x\\)로 치환해 양의 무한대 문제로 환원.',
    steps:[
      {tag:'STEP 1', title:'\\(-x=t\\) 치환 — \\(x\\to-\\infty\\) ⇒ \\(t\\to+\\infty\\)', body:`<p>\\(x=-t\\)이므로 \\(x^2=t^2\\), \\(2x=-2t\\), \\(x+4=-t+4\\).</p>
<div class="calc purple">\\(= \\displaystyle \\lim_{t\\to \\infty} \\dfrac{\\sqrt{4t^2-3t}+2t}{-t+4}\\)</div>
<div class="hint">⚠️ \\(x\\lt 0\\)에서 \\(\\sqrt{x^2}=|x|=-x\\). 치환을 쓰면 부호 실수가 줄어든다.</div>`},
      {tag:'STEP 2', title:'분모·분자 \\(t\\)로 나누기', body:`<div class="calc">\\(= \\displaystyle \\lim_{t\\to \\infty} \\dfrac{\\sqrt{4-3/t}+2}{-1+4/t}\\)</div>`},
      {tag:'STEP 3', title:'\\(t\\to \\infty\\) 대입', body:`<div class="calc purple">\\(= \\dfrac{\\sqrt{4}+2}{-1+0} = \\dfrac{4}{-1} = -4\\)</div>`}
    ]

  /* ───────── 예제 4 ───────── */
  {
    id:'c1-e4', level:'example', levelLabel:'예제', num:4, type:'choice',
    subLabel:'미정계수의 결정',
    title:'\\(\\displaystyle \\lim_{x\\to 1} \\dfrac{x^3+x-2}{ax^2+bx}=\\alpha\\)',
    question:`<p>두 상수 \\(\\alpha\\,(\\alpha\\gt 0)\\), \\(b\\)에 대하여 \\(\\displaystyle \\lim_{x\\to 1}\\dfrac{x^3+x-2}{\\alpha x^2+bx}=\\alpha\\) 일 때, \\(\\alpha-b\\)의 값은?</p>`,
    choices:['\\(1\\)','\\(2\\)','\\(3\\)','\\(4\\)','\\(5\\)'], answer:3,
    keypoint:'\\(\\lim \\dfrac{f}{g}=\\alpha\\,(\\alpha\\ \\text{유한})\\) 일 때 \\(\\lim g = 0\\) ⇒ \\(\\lim f = 0\\). 그 역도 (\\(\\alpha \\neq 0\\))이면 성립.',
    steps:[
      {tag:'STEP 1', title:'분자가 \\(0\\)인 것을 먼저 확인', body:`<p>\\(x\\to 1\\) 대입: 분자 \\(=1+1-2=0\\). 분자가 \\(0\\)인데 극한값이 0이 아닌 유한값이 존재하므로 → <b>분모도 0이어야 한다</b>.</p>
<div class="calc">\\(\\alpha + b = 0 \\ \\Rightarrow\\ b = -\\alpha\\)</div>`},
      {tag:'STEP 2', title:'대입하고 인수분해', body:`<div class="calc">\\(\\dfrac{x^3+x-2}{\\alpha x^2 - \\alpha x} = \\dfrac{(x-1)(x^2+x+2)}{\\alpha x(x-1)} = \\dfrac{x^2+x+2}{\\alpha x}\\)</div>`},
      {tag:'STEP 3', title:'\\(x\\to 1\\) 대입 → 방정식 풀이', body:`<div class="calc purple">\\(\\dfrac{1+1+2}{\\alpha\\cdot 1} = \\dfrac{4}{\\alpha} = \\alpha\\)</div>
<div class="calc">\\(\\alpha^2 = 4,\\ \\alpha\\gt 0 \\Rightarrow \\alpha=2,\\ b=-2\\)</div>`},
      {tag:'STEP 4', title:'최종', body:`<div class="calc purple">\\(\\alpha - b = 2 - (-2) = 4\\)</div>`}
    ]
  },

  /* ───────── 유제 7 ───────── */
  {
    id:'c1-ex7', level:'exercise', levelLabel:'유제', num:7, type:'choice',
    subLabel:'[26009-0007] · 무리식 미정계수',
    title:'\\(\\displaystyle \\lim_{x\\to 2}\\dfrac{\\sqrt{x+a}-3}{x-2}=b\\)',
    question:`<p>\\(\\displaystyle \\lim_{x\\to 2}\\dfrac{\\sqrt{x+a}-3}{x-2}=b\\)일 때, \\(ab\\)의 값은? (단, \\(a\\), \\(b\\)는 상수이다.)</p>`,
    choices:['\\(\\dfrac{7}{6}\\)','\\(\\dfrac{7}{5}\\)','\\(\\dfrac{7}{4}\\)','\\(\\dfrac{7}{3}\\)','\\(\\dfrac{7}{2}\\)'], answer:0,
    keypoint:'무리식 \\(\\sqrt{\\ }-c\\) 형태의 0/0은 "켤레 곱"으로 유리화하면 분자에서 약분 인수가 떨어진다.',
    steps:[
      {tag:'STEP 1', title:'분자가 \\(0\\)이어야 한다', body:`<p>분모 \\(\\to 0\\), 극한값 유한 → 분자도 \\(\\to 0\\).</p>
<div class="calc">\\(\\sqrt{2+a}-3=0 \\Rightarrow 2+a=9 \\Rightarrow a=7\\)</div>`},
      {tag:'STEP 2', title:'유리화로 \\(b\\) 계산', body:`<div class="calc">\\(\\dfrac{\\sqrt{x+7}-3}{x-2}\\cdot \\dfrac{\\sqrt{x+7}+3}{\\sqrt{x+7}+3} = \\dfrac{(x+7)-9}{(x-2)(\\sqrt{x+7}+3)} = \\dfrac{1}{\\sqrt{x+7}+3}\\)</div>
<div class="calc purple">\\(\\to \\dfrac{1}{\\sqrt{9}+3} = \\dfrac{1}{6}\\) ⇒ \\(b=\\dfrac{1}{6}\\)</div>`},
      {tag:'STEP 3', title:'곱', body:`<div class="calc purple">\\(ab = 7\\cdot \\dfrac{1}{6} = \\dfrac{7}{6}\\)</div>`}
    ]
  },

  /* ───────── 유제 8 ───────── */
  {
    id:'c1-ex8', level:'exercise', levelLabel:'유제', num:8, type:'choice',
    subLabel:'[26009-0008] · 샌드위치(조임) 정리 + 치환',
    title:'\\(x^2+3x \\leq f(x) \\leq 2x^2+3x\\) → \\(\\dfrac{x^2+f(2x)}{6x+f(x)}\\)',
    question:`<p>함수 \\(f(x)\\)가 모든 실수 \\(x\\)에 대하여 \\(x^2+3x \\leq f(x) \\leq 2x^2+3x\\) 를 만족시킬 때, \\(\\displaystyle \\lim_{x\\to 0}\\dfrac{x^2+f(2x)}{6x+f(x)}\\)의 값은?</p>`,
    choices:['\\(\\dfrac{1}{3}\\)','\\(\\dfrac{1}{2}\\)','\\(\\dfrac{2}{3}\\)','\\(\\dfrac{5}{6}\\)','\\(1\\)'], answer:2,
    keypoint:'샌드위치 정리에서 \\(\\dfrac{f(x)}{x}\\) 형태를 얻으려면 "\\(x\\)로 나누는" 1번 스텝이 절반의 전부.',
    steps:[
      {tag:'STEP 1', title:'양변을 \\(x\\)로 나눠 \\(\\dfrac{f(x)}{x}\\) 극한 짜내기', body:`<p><b>\\(x\\gt 0\\)일 때</b>: \\(x+3 \\leq \\dfrac{f(x)}{x} \\leq 2x+3\\). 양 끝 모두 \\(\\to 3\\) ⇒ \\(\\displaystyle \\lim_{x\\to 0+}\\dfrac{f(x)}{x}=3\\).</p>
<p><b>\\(x\\lt 0\\)일 때</b>: 부등호가 반대로 뒤집어지지만 똑같이 양 끝 \\(\\to 3\\) ⇒ \\(\\displaystyle \\lim_{x\\to 0-}\\dfrac{f(x)}{x}=3\\).</p>
<div class="calc purple">\\(\\displaystyle \\lim_{x\\to 0}\\dfrac{f(x)}{x}=3\\)</div>`},
      {tag:'STEP 2', title:'\\(\\dfrac{f(2x)}{2x}\\)도 같은 극한', body:`<p>\\(2x = t\\)로 치환: \\(t\\to 0\\) ⇒ \\(\\displaystyle \\lim_{x\\to 0}\\dfrac{f(2x)}{2x} = 3\\).</p>`},
      {tag:'STEP 3', title:'분모·분자를 \\(x\\)로 나눠 정리', body:`<div class="calc">\\(\\dfrac{x^2+f(2x)}{6x+f(x)} = \\dfrac{x + \\dfrac{f(2x)}{2x}\\cdot 2}{6 + \\dfrac{f(x)}{x}}\\)</div>
<div class="calc purple">\\(\\to \\dfrac{0 + 3\\cdot 2}{6 + 3} = \\dfrac{6}{9} = \\dfrac{2}{3}\\)</div>`}
    ]
  },

  {
    id:'c1-b2', level:'basic', levelLabel:'기초', num:2, type:'choice',
    subLabel:'[26009-0010] · 조각함수 좌·우극한 일치',
    title:'\\(\\displaystyle \\lim_{x\\to 2}f(x)=b\\) 조건에서 \\(a+b\\)',
    question:`<p>함수 \\(f(x)=\\begin{cases} x+1 & (x\\lt 2) \\\\ 4 & (x=2) \\\\ ax-1 & (x\\gt 2)\\end{cases}\\) 에 대하여 \\(\\displaystyle \\lim_{x\\to 2}f(x)=b\\)일 때, \\(a+b\\)의 값은? (단, \\(a\\), \\(b\\)는 상수)</p>`,
    choices:['\\(3\\)','\\(4\\)','\\(5\\)','\\(6\\)','\\(7\\)'], answer:2,
    keypoint:'함숫값과 극한값을 혼동하지 않는 것이 조각함수 극한 첫 번째 함정.',
    steps:[
      {tag:'STEP 1', title:'극한 존재 조건 — 좌극한 = 우극한', body:`<div class="calc">\\(\\displaystyle \\lim_{x\\to 2-}f(x)=2+1=3,\\ \\lim_{x\\to 2+}f(x)=2a-1\\)</div>
<div class="calc purple">\\(3 = 2a-1 \\Rightarrow a = 2,\\ b=3\\)</div>
<div class="hint">⚠️ \\(f(2)=4\\)이지만 극한은 \\(2\\)에서의 \\(x\\) 값들이 다가가는 값. \\(f(2)\\)와 다를 수 있음에 유의.</div>`},
      {tag:'STEP 2', title:'합', body:`<div class="calc purple">\\(a+b = 2+3 = 5\\)</div>`}
    ]
  },

  /* ───────── 기초 3 ───────── */
  {
    id:'c1-b3', level:'basic', levelLabel:'기초', num:3, type:'choice',
    subLabel:'[26009-0011] · 곱·결합 분리',
    title:'\\((x^2-1)f(x)=3\\) → \\((x^3-1)f(x)\\)',
    question:`<p>함수 \\(f(x)\\)에 대하여 \\(\\displaystyle \\lim_{x\\to 1}(x^2-1)f(x)=3\\)일 때, \\(\\displaystyle \\lim_{x\\to 1}(x^3-1)f(x)\\)의 값은?</p>`,
    choices:['\\(\\dfrac{3}{2}\\)','\\(3\\)','\\(\\dfrac{9}{2}\\)','\\(6\\)','\\(\\dfrac{15}{2}\\)'], answer:2,
    keypoint:'\\(\\infty \\cdot 0\\) 꼴은 "이미 알고 있는 곱"을 인수로 분해해서 결합으로 분리.',
    steps:[
      {tag:'STEP 1', title:'\\(x^3-1\\)을 \\(x^2-1\\)과 비율로 분해', body:`<div class="calc">\\(\\dfrac{x^3-1}{x^2-1} = \\dfrac{(x-1)(x^2+x+1)}{(x-1)(x+1)} = \\dfrac{x^2+x+1}{x+1}\\)</div>
<div class="calc purple">\\(\\to \\dfrac{3}{2}\\) (단, \\(x\\to 1\\))</div>`},
      {tag:'STEP 2', title:'곱 분리', body:`<div class="calc">\\((x^3-1)f(x) = (x^2-1)f(x) \\cdot \\dfrac{x^3-1}{x^2-1}\\)</div>
<div class="calc purple">\\(\\lim = 3 \\cdot \\dfrac{3}{2} = \\dfrac{9}{2}\\)</div>`}
    ]
  },

  /* ───────── 기초 4 ───────── */
  {
    id:'c1-b4', level:'basic', levelLabel:'기초', num:4, type:'choice',
    subLabel:'[26009-0012] · 절댓값 함수 좌·우 분리',
    title:'\\(f(x)=\\dfrac{ax+|x|}{|x|}\\) — 우극한 \\(=5\\), 좌극한?',
    question:`<p>함수 \\(f(x)=\\dfrac{ax+|x|}{|x|}\\)에 대하여 \\(\\displaystyle \\lim_{x\\to 0+} f(x) = 5\\)일 때, \\(\\displaystyle \\lim_{x\\to 0-} f(x)\\)의 값은? (단, \\(a\\)는 상수.)</p>`,
    choices:['\\(-3\\)','\\(-1\\)','\\(1\\)','\\(3\\)','\\(5\\)'], answer:0,
    keypoint:'\\(|x|\\)는 부호별로 식을 갈라 정리한다 — \\(x\\gt 0\\): \\(+x\\), \\(x\\lt 0\\): \\(-x\\).',
    steps:[
      {tag:'STEP 1', title:'\\(x\\gt 0\\): \\(|x|=x\\) → \\(f(x)=a+1\\)', body:`<div class="calc">\\(f(x)=\\dfrac{ax+x}{x} = a+1 = 5 \\Rightarrow a=4\\)</div>`},
      {tag:'STEP 2', title:'\\(x\\lt 0\\): \\(|x|=-x\\) → 간소화', body:`<div class="calc">\\(f(x) = \\dfrac{4x+(-x)}{-x} = \\dfrac{3x}{-x} = -3\\)</div>
<div class="calc purple">\\(\\displaystyle \\lim_{x\\to 0-} f(x) = -3\\)</div>`}
    ]
  },

  /* ───────── 기초 5 ───────── */
  {
    id:'c1-b5', level:'basic', levelLabel:'기초', num:5, type:'choice',
    subLabel:'[26009-0013] · 0/0 미정계수',
    title:'\\(\\displaystyle \\lim_{x\\to 2}\\dfrac{x^2+ax+6}{x-2}=b\\)에서 \\(a+b\\)',
    question:`<p>\\(\\displaystyle \\lim_{x\\to 2}\\dfrac{x^2+ax+6}{x-2}=b\\)일 때 \\(a+b\\)의 값은? (단, \\(a\\), \\(b\\)는 상수.)</p>`,
    choices:['\\(-8\\)','\\(-6\\)','\\(-4\\)','\\(-2\\)','\\(0\\)'], answer:1,
    keypoint:'분모가 일차 \\((x-2)\\) 인수를 갖도록 \\(a\\) 결정 → 약분 → 대입.',
    steps:[
      {tag:'STEP 1', title:'분자가 \\(0\\)이어야 한다', body:`<div class="calc">\\(4+2a+6=0 \\Rightarrow a=-5\\)</div>`},
      {tag:'STEP 2', title:'대입 → 인수분해', body:`<div class="calc">\\(\\dfrac{x^2-5x+6}{x-2} = \\dfrac{(x-2)(x-3)}{x-2} = x-3\\)</div>
<div class="calc purple">\\(\\to 2-3 = -1 = b\\)</div>`},
      {tag:'STEP 3', title:'합', body:`<div class="calc purple">\\(a+b = -5+(-1) = -6\\)</div>`}
    ]
  },

  {
    id:'c1-b6', level:'basic', levelLabel:'기초', num:6, type:'choice',
    subLabel:'[26009-0014] · 유리화 + 미정계수',
    title:'\\(\\displaystyle \\lim_{x\\to -1}\\dfrac{x+1}{\\sqrt{x+a}+b}=6\\)에서 \\(a+b\\)',
    question:`<p>\\(\\displaystyle \\lim_{x\\to -1}\\dfrac{x+1}{\\sqrt{x+a}+b}=6\\)일 때 \\(a+b\\)의 값은? (단, \\(a\\), \\(b\\)는 상수.)</p>`,
    choices:['\\(3\\)','\\(4\\)','\\(5\\)','\\(6\\)','\\(7\\)'], answer:4,
    keypoint:'분모 유리화 후 \\(x+1\\)이 약분돼 \\(2\\sqrt{a-1}\\) 형태가 나타나는 패턴.',
    steps:[
      {tag:'STEP 1', title:'분모가 \\(0\\)이어야 한다', body:`<p>분자 \\(\\to 0\\), 극한값 \\(6 \\neq 0\\) → 분모도 \\(\\to 0\\).</p>
<div class="calc">\\(\\sqrt{-1+a}+b=0 \\Rightarrow b = -\\sqrt{a-1}\\)</div>`},
      {tag:'STEP 2', title:'유리화로 분모에서 \\(x+1\\) 약분', body:`<div class="calc">\\(\\dfrac{x+1}{\\sqrt{x+a}-\\sqrt{a-1}}\\cdot\\dfrac{\\sqrt{x+a}+\\sqrt{a-1}}{\\sqrt{x+a}+\\sqrt{a-1}} = \\dfrac{(x+1)(\\sqrt{x+a}+\\sqrt{a-1})}{(x+a)-(a-1)} = \\sqrt{x+a}+\\sqrt{a-1}\\)</div>
<div class="calc purple">\\(\\to 2\\sqrt{a-1}=6 \\Rightarrow a-1=9 \\Rightarrow a=10,\\ b=-3\\)</div>`},
      {tag:'STEP 3', title:'합', body:`<div class="calc purple">\\(a+b=10+(-3)=7\\)</div>`}
    ]
  },

  /* ───────── 기초 7 ───────── */
  {
    id:'c1-b7', level:'basic', levelLabel:'기초', num:7, type:'choice',
    subLabel:'[26009-0015] · ∞/∞ + 0/0 동시 조건',
    title:'두 극한 조건으로 \\(f(1)\\)',
    question:`<p>다항함수 \\(f(x)\\)에 대하여 \\(\\displaystyle \\lim_{x\\to \\infty}\\dfrac{f(x)}{x^2+1}=3,\\ \\lim_{x\\to 0}\\dfrac{f(x)}{x}=7\\) 일 때, \\(f(1)\\)의 값은?</p>`,
    choices:['\\(7\\)','\\(8\\)','\\(9\\)','\\(10\\)','\\(11\\)'], answer:3,
    keypoint:'다항함수 결정의 기본 — ∞/∞로 차수·최고차, 0/0으로 상수·일차 계수 식별.',
    steps:[
      {tag:'STEP 1', title:'∞/∞ 조건 → \\(f\\)는 이차, 최고차 계수 \\(3\\)', body:`<p>분모 차수 2, 극한값 유한·0이 아님 ⇒ 분자 차수도 2, 최고차 계수 비율 = 3.</p>
<div class="calc">\\(f(x) = 3x^2 + ax + b\\)</div>`},
      {tag:'STEP 2', title:'0/0 조건 → 상수항 \\(b=0\\)', body:`<p>분모 \\(\\to 0\\), 극한 유한 → 분자 \\(\\to 0\\).</p>
<div class="calc">\\(f(0)=b=0\\)</div>
<div class="calc">\\(\\dfrac{3x^2+ax}{x} = 3x+a \\to a = 7\\)</div>`},
      {tag:'STEP 3', title:'\\(f(1)\\)', body:`<div class="calc purple">\\(f(x)=3x^2+7x \\Rightarrow f(1)=3+7=10\\)</div>`}
    ]
  },

  /* ───────── 기초 8 ───────── */
  {
    id:'c1-b8', level:'basic', levelLabel:'기초', num:8, type:'choice',
    subLabel:'[26009-0016] · 샌드위치 정리 (∞)',
    title:'\\(x(x+4)\\leq f(x)+x^2 \\leq (x+2)^2\\) → \\(\\dfrac{f(2x)}{6x+1}\\)',
    question:`<p>함수 \\(f(x)\\)가 모든 양의 실수 \\(x\\)에 대하여 \\(x(x+4)\\leq f(x)+x^2 \\leq (x+2)^2\\)을 만족할 때, \\(\\displaystyle \\lim_{x\\to \\infty}\\dfrac{f(2x)}{6x+1}\\)의 값은?</p>`,
    choices:['\\(\\dfrac{1}{3}\\)','\\(\\dfrac{2}{3}\\)','\\(1\\)','\\(\\dfrac{4}{3}\\)','\\(\\dfrac{5}{3}\\)'], answer:3,
    keypoint:'조임 정리 (∞) — 양 끝 식의 최고차 계수 비율이 답.',
    steps:[
      {tag:'STEP 1', title:'\\(x^2\\) 빼서 \\(f(x)\\) 범위 정리', body:`<p>\\((x+2)^2 = x^2+4x+4\\), \\(x(x+4)=x^2+4x\\) 이므로</p>
<div class="calc">\\(x^2+4x \\leq f(x)+x^2 \\leq x^2+4x+4\\)</div>
<div class="calc purple">\\(4x \\leq f(x) \\leq 4x+4\\)</div>`},
      {tag:'STEP 2', title:'\\(x\\to 2x\\) 대입 후 \\(6x+1\\)로 나누기', body:`<div class="calc">\\(8x \\leq f(2x) \\leq 8x+4\\)</div>
<div class="calc">\\(\\dfrac{8x}{6x+1} \\leq \\dfrac{f(2x)}{6x+1} \\leq \\dfrac{8x+4}{6x+1}\\)</div>
<div class="calc purple">양 끝 모두 \\(\\to \\dfrac{8}{6} = \\dfrac{4}{3}\\)</div>`}
    ]
  },

  /* ───────── 기본 1 ───────── */
  {
    id:'c1-s1', level:'standard', levelLabel:'기본', num:1, type:'choice',
    subLabel:'[26009-0017] · 이차함수 ∞−∞ 결정',
    title:'이차함수 \\(f\\): \\(\\sqrt{f(x)}-2x\\to 1\\), \\([f(x)-f(-x)]/x = f(0)\\)',
    question:`<p>이차함수 \\(f(x)\\)에 대하여 \\(\\displaystyle \\lim_{x\\to \\infty}(\\sqrt{f(x)}-2x)=1,\\ \\lim_{x\\to \\infty}\\dfrac{f(x)-f(-x)}{x}=f(0)\\) 일 때, \\(f(1)\\)의 값은?</p>`,
    choices:['\\(15\\)','\\(16\\)','\\(17\\)','\\(18\\)','\\(19\\)'], answer:1,
    keypoint:'\\(\\sqrt{\\ }-\\) 형태는 유리화 후 "분자 차수가 분모 차수와 같아야 유한".',
    steps:[
      {tag:'STEP 1', title:'\\(\\sqrt{f}-2x\\)의 유리화로 차수·계수 결정', body:`<p>\\(f(x)=ax^2+bx+c\\,(a\\neq 0)\\)로 놓고</p>
<div class="calc">\\(\\sqrt{f}-2x = \\dfrac{f(x)-4x^2}{\\sqrt{f}+2x} = \\dfrac{(a-4)x^2+bx+c}{\\sqrt{ax^2+bx+c}+2x}\\)</div>
<p>분모 ~ \\((\\sqrt{a}+2)x\\), 분자 차수가 \\(2\\)면 발산. 따라서 \\(a=4\\). 그러면 분자 \\(=bx+c\\), 분모 ~ \\(4x\\) →</p>
<div class="calc purple">\\(\\dfrac{b}{\\sqrt{a}+2} = \\dfrac{b}{4}=1 \\Rightarrow b=4\\)</div>`},
      {tag:'STEP 2', title:'\\([f(x)-f(-x)]/x\\) 계산', body:`<div class="calc">\\(f(x)-f(-x) = (4x^2+4x+c)-(4x^2-4x+c) = 8x\\)</div>
<div class="calc">\\(\\dfrac{8x}{x} = 8 \\to 8 = f(0) = c\\)</div>`},
      {tag:'STEP 3', title:'\\(f(1)\\)', body:`<div class="calc purple">\\(f(x)=4x^2+4x+8 \\Rightarrow f(1)=4+4+8=16\\)</div>`}
    ]
  },

  /* ───────── 기본 2 ───────── */
  {
    id:'c1-s2', level:'standard', levelLabel:'기본', num:2, type:'choice',
    subLabel:'[26009-0018] · 조각함수 + 좌극한 방정식',
    title:'\\(f(k) + \\lim_{x\\to k-} f(x) = 2a+2\\)인 \\(k\\)가 \\(2\\)개',
    question:`<p>\\(f(x)=\\begin{cases} x & (x\\lt a) \\\\ 4 & (x=a) \\\\ x-1 & (x\\gt a)\\end{cases}\\) 라 하자. \\(f(k) + \\displaystyle \\lim_{x\\to k-}f(x)=2a+2\\)를 만족시키는 모든 실수 \\(k\\)가 \\(k_1,k_2\\,(k_1\\neq k_2)\\) 일 때, \\(k_1+k_2\\)?</p>`,
    choices:['\\(3\\)','\\(4\\)','\\(5\\)','\\(6\\)','\\(7\\)'], answer:3,
    keypoint:'조각함수 함숫값 + 좌극한 문제 — "정의역의 케이스 (ⅰ),(ⅱ),(ⅲ)"로 분류해 식 따로 정리.',
    steps:[
      {tag:'STEP 1', title:'\\(k\\)의 위치별 케이스', body:`<p>(ⅰ) \\(k\\lt a\\): \\(f(k)=k,\\ \\lim_{-}=k\\). 식 → \\(2k=2a+2\\ \\Rightarrow\\ k=a+1\\). 그러나 \\(k\\lt a\\) 위반.</p>
<p>(ⅱ) \\(k=a\\): \\(f(a)=4,\\ \\lim_{x\\to a-}=a\\). 식 → \\(4+a=2a+2 \\Rightarrow a=2\\). 이때 \\(k=2\\).</p>
<p>(ⅲ) \\(k\\gt a\\): \\(f(k)=k-1,\\ \\lim_{-}=k-1\\). 식 → \\(2(k-1)=2a+2 \\Rightarrow k=a+2\\). 만족.</p>`},
      {tag:'STEP 2', title:'두 개의 \\(k\\) — \\(a=2\\) 확정, \\(k_1+k_2\\)', body:`<p>두 해가 \\(k=a=2\\)와 \\(k=a+2=4\\). 합은</p>
<div class="calc purple">\\(k_1+k_2 = 2+4=6\\)</div>`}
    ]
  },

  /* ───────── 기본 3 ───────── */
  {
    id:'c1-s3', level:'standard', levelLabel:'기본', num:3, type:'choice',
    subLabel:'[26009-0019] · 두 조각함수 차의 극한 존재',
    title:'모든 실수 \\(k\\)에 대해 \\(\\lim_{x\\to k}(f-g)\\) 존재',
    question:`<p>\\(f(x)=\\begin{cases} x+3 & (x\\leq 1) \\\\ x-3 & (x\\gt 1)\\end{cases}\\), \\(g(x)=\\begin{cases} x^2+ax & (x\\leq a)\\\\ bx & (x\\gt a)\\end{cases}\\) 일 때, 모든 실수 \\(k\\)에 대해 \\(\\displaystyle \\lim_{x\\to k}(f(x)-g(x))\\)가 존재할 때 \\(a+b\\)? (단, \\(a,b\\)는 상수)</p>`,
    choices:['\\(-3\\)','\\(-1\\)','\\(0\\)','\\(1\\)','\\(3\\)'], answer:0,
    keypoint:'차의 극한이 모든 점에서 존재 ⇔ 점프의 위치·크기가 정확히 상쇄.',
    steps:[
      {tag:'STEP 1', title:'\\(f\\)의 불연속점은 \\(x=1\\) — \\(g\\)도 \\(x=a\\)에서 끊임', body:`<p>\\(\\lim_{x\\to 1-} f = 4,\\ \\lim_{x\\to 1+} f = -2\\) 이므로 \\(\\lim_{x\\to 1} f\\) 존재 ✗.</p>
<p>\\(\\lim_{x\\to k}(f-g)\\)가 존재하려면 \\(f\\)의 끊김을 \\(g\\)도 같은 위치에서 같은 점프로 갖아야 한다. → \\(a=1\\).</p>`},
      {tag:'STEP 2', title:'\\(a=1\\) 대입 후 \\(x\\to 1\\) 좌·우극한 일치 강제', body:`<div class="calc">\\(x\\leq 1\\): \\(f-g = (x+3)-(x^2+x) = -x^2+3\\)</div>
<div class="calc">\\(x\\gt 1\\): \\(f-g = (x-3)-bx = (1-b)x-3\\)</div>
<div class="calc">\\(x\\to 1-\\): \\(-1+3=2\\), \\(x\\to 1+\\): \\((1-b)-3 = -b-2\\)</div>
<div class="calc purple">\\(2 = -b-2 \\Rightarrow b=-4\\)</div>`},
      {tag:'STEP 3', title:'합', body:`<div class="calc purple">\\(a+b=1+(-4)=-3\\)</div>`}
    ]
  },

  /* ───────── 기본 4 ───────── */
  {
    id:'c1-s4', level:'standard', levelLabel:'기본', num:4, type:'short',
    subLabel:'[26009-0020] · h(t)=교점 수 (서답형)',
    title:'\\(g(x)=\\min(f(x),4x)\\)와 직선 \\(y=t\\)의 교점 수',
    question:`<p>최고차항의 계수가 1인 이차함수 \\(f(x)\\)에 대하여 \\(g(x)=\\begin{cases} f(x) & (f(x)\\lt 4x)\\\\ 4x & (f(x)\\geq 4x)\\end{cases}\\). \\(y=t\\)와 \\(y=g(x)\\)의 교점 수를 \\(h(t)\\)라 할 때 (가) \\(\\lim_{t\\to 0+} h(t) \\gt  \\lim_{t\\to 0-} h(t)\\) (나) \\(h(-2)+h(1)+h(4)=6\\)이면 \\(f(7)\\)?</p>`,
    answerText:'\\(16\\)',
    keypoint:'\\(\\min\\)함수의 교점 수 문제 — "극값" 위치에서 좌·우극한이 달라진다.',
    steps:[
      {tag:'STEP 1', title:'\\(g\\)의 그래프 모양 분석', body:`<p>\\(g = \\min(f,4x)\\). 곡선 \\(y=f(x)\\)와 직선 \\(y=4x\\)가 두 점 \\(P(p,f(p))\\), \\(Q(q,f(q))\\, (p\\lt q)\\)에서 만남. 두 점 사이에선 \\(g=f\\), 바깥에선 \\(g=4x\\). 점 \\(P\\)가 \\(f\\)의 축 왼쪽이면 \\(g\\)는 증가→감소→증가 (그림 2).</p>`},
      {tag:'STEP 2', title:'조건 (가)·(나) 해석 — \\(t_1=0,\\ t_2=4\\)', body:`<p>\\(g\\)의 극댓값=\\(t_1\\), 극솟값=\\(t_2\\,(\\lt t_1)\\)이라 하자. 조건 (가)에서 \\(t_1=0\\) (\\(0\\)에서 우극한>좌극한이려면 직선 \\(y=0\\)이 극댓값과 같아야 함).</p>
<p>\\(h(-2)=1,\\ h(1)+h(4)=5\\). \\(h(1)=3,\\ h(4)=2\\Rightarrow t_2=4\\). 즉 \\(y=4\\)와 \\(y=4x\\)의 교점은 \\((1,4)\\) → 곡선 위의 점이므로 \\(f(1)=4\\).</p>`},
      {tag:'STEP 3', title:'\\(f\\) 결정 → \\(f(7)\\)', body:`<p>꼭짓점 \\(y\\) 좌표 \\(=0\\), \\(x\\) 좌표\\(\\gt 1\\), 계수 1 → \\(f(x)=(x-a)^2,\\ a\\gt 1\\). \\(f(1)=(1-a)^2=4 \\Rightarrow a=3\\).</p>
<div class="calc purple">\\(f(x)=(x-3)^2,\\ f(7)=4^2=16\\)</div>`}
    ]
  },

  /* ───────── 기본 5 ───────── */
  {
    id:'c1-s5', level:'standard', levelLabel:'기본', num:5, type:'short',
    subLabel:'[26009-0021] · 0/0 + 미정계수 + 불존재 조건 (서답형)',
    title:'\\(\\displaystyle \\lim_{x\\to 1}\\dfrac{f(x)+3}{(x-1)(f(x)+f(k))}\\) 불존재 \\(\\Leftrightarrow k=0,2\\)',
    question:`<p>이차함수 \\(f(x)\\)에 대해 \\(\\displaystyle \\lim_{x\\to 1}\\dfrac{f(x)+3}{(x-1)(f(x)+f(k))}\\) 의 값이 <b>존재하지 않도록</b> 하는 실수 \\(k\\)가 \\(0\\)과 \\(2\\) 뿐일 때, \\(f(4)\\)?</p>`,
    answerText:'\\(51\\)',
    keypoint:'"불존재 조건"의 핵심 — 약분 후 식이 \\(\\dfrac{0이\\ 아닌\\ 값}{0}\\) 또는 \\(\\dfrac{\\text{유한}}{0}\\) 형태가 되는 \\(k\\).',
    steps:[
      {tag:'STEP 1', title:'\\(k\\neq 0, 2\\)에서 극한 존재 ⇒ 분자 \\(\\to 0\\)', body:`<p>분모 \\(\\to 0\\), 극한 존재 ⇒ 분자도 \\(\\to 0\\) ⇒ \\(f(1)+3=0\\), 즉 \\(f(1)=-3\\).</p>
<p>\\(f(x)=ax^2+bx+c\\)라 하고 \\(a+b+c+3=0 \\Rightarrow c=-a-b-3\\).</p>
<div class="calc">\\(f(x)+3 = ax^2+bx-a-b = (x-1)(ax+a+b)\\)</div>
<div class="calc purple">전체 \\(= \\dfrac{ax+a+b}{f(x)+f(k)}\\)</div>`},
      {tag:'STEP 2', title:'\\(k=0\\)에서 "불존재" ⇒ \\(\\lim(f+f(0))=0\\)이지만 분자 분의 0이 안 됨', body:`<p>\\(f(0)=c=-a-b-3\\) 이므로 \\(\\lim_{x\\to 1}(f(x)+f(0)) = f(1)+f(0) = -3+c = -a-b-6\\). 이게 \\(0\\)이어야 함.</p>
<div class="calc">\\(a+b=-6\\) ... ㉠</div>`},
      {tag:'STEP 3', title:'\\(k=2\\)에서도 동일하게 ⇒ \\(f(2)+f(1)=0\\) → \\(3a+b=6\\) ... ㉡', body:`<p>\\(f(2)=4a+2b+c = 4a+2b-a-b-3=3a+b-3\\). \\(f(2)+f(1)=3a+b-3-3=3a+b-6=0\\).</p>
<p>㉠, ㉡ 연립 \\(\\Rightarrow a=6,\\ b=-12,\\ c=-6-(-12)-3=3\\).</p>`},
      {tag:'STEP 4', title:'\\(f(4)\\)', body:`<div class="calc purple">\\(f(x)=6x^2-12x+3 \\Rightarrow f(4)=96-48+3=51\\)</div>`}
    ]
  },

  /* ───────── 기본 6 ───────── */
  {
    id:'c1-s6', level:'standard', levelLabel:'기본', num:6, type:'choice',
    subLabel:'[26009-0022] · \\(x^n f(1/x)\\) 차수 결정',
    title:'\\(\\lim x^n f(1/x) = 4p\\), \\(\\lim\\dfrac{f(x)+2x^2-x}{x^n+x}=p\\) — \\(f(-1)\\) 합',
    question:`<p>다음 조건을 만족시키는 모든 다항함수 \\(f(x)\\)에 대하여 \\(f(-1)\\)의 값의 합은? <br>어떤 자연수 \\(n\\)과 어떤 실수 \\(p\\,(p\\neq 0)\\)에 대하여 \\(\\displaystyle \\lim_{x\\to \\infty} x^n f\\!\\left(\\dfrac{1}{x}\\right)=4p\\), \\(\\displaystyle \\lim_{x\\to \\infty}\\dfrac{f(x)+2x^2-x}{x^n+x}=p\\) 이다.</p>`,
    choices:['\\(-8\\)','\\(-\\dfrac{20}{3}\\)','\\(-\\dfrac{16}{3}\\)','\\(-4\\)','\\(-\\dfrac{8}{3}\\)'], answer:1,
    keypoint:'\\(\\lim x^n f(1/x)\\) 형태는 \\(t=1/x\\) 치환 — \\(f\\)의 최저차항 정보가 나온다.',
    steps:[
      {tag:'STEP 1', title:'\\(1/x=t\\) 치환 — 첫 조건의 의미', body:`<p>\\(\\displaystyle \\lim_{t\\to 0+}\\dfrac{f(t)}{t^n}=4p\\). \\(f\\)의 모든 항 차수 \\(\\geq n\\), \\(x^n\\) 계수 \\(=4p\\).</p>`},
      {tag:'STEP 2', title:'\\(n=1\\) 케이스', body:`<p>두 번째 식 \\(=\\dfrac{f(x)+2x^2-x}{2x}=p\\). 분자 \\(=2px+q\\) ⇒ \\(f(x)=-2x^2+(2p+1)x+q\\). STEP 1 조건 \\(2p+1=4p\\), \\(q=0\\) ⇒ \\(p=\\dfrac{1}{2}\\).</p>
<div class="calc purple">\\(f(x)=-2x^2+2x,\\ f(-1)=-4\\)</div>`},
      {tag:'STEP 3', title:'\\(n=2\\) 케이스', body:`<p>두 번째 식 \\(=\\dfrac{f+2x^2-x}{x^2+x}=p\\) ⇒ \\(f(x)=(p-2)x^2+(r+1)x+s\\). STEP 1: \\(p-2=4p,\\ r+1=0,\\ s=0\\) ⇒ \\(p=-\\dfrac{2}{3}\\).</p>
<div class="calc purple">\\(f(x)=-\\dfrac{8}{3}x^2,\\ f(-1)=-\\dfrac{8}{3}\\)</div>`},
      {tag:'STEP 4', title:'\\(n\\geq 3\\) — \\(p=4p\\) ⇒ \\(p=0\\) 위반, 합 계산', body:`<div class="calc purple">\\(-4 + \\left(-\\dfrac{8}{3}\\right) = -\\dfrac{20}{3}\\)</div>`}
    ]
  },

  /* ───────── 기본 7 ───────── */
  {
    id:'c1-s7', level:'standard', levelLabel:'기본', num:7, type:'choice',
    subLabel:'[26009-0023] · 도형 + ∞ 극한',
    title:'\\(y=\\sqrt{x}\\) 위 점 \\(P(t^2,t)\\)에서 \\(\\overline{PH}-\\overline{QH}\\)',
    question:`<p>그림과 같이 \\(t\\gt 1\\)인 실수 \\(t\\)에 대하여 곡선 \\(y=\\sqrt{x}\\) 위의 점 \\(P(t^2,t)\\)를 지나고 기울기가 \\(-1\\)인 직선이 \\(x\\)축과 만나는 점을 \\(Q\\), 점 \\(Q\\)에서 직선 \\(OP\\)에 내린 수선의 발을 \\(H\\)라 하자. \\(\\displaystyle \\lim_{t\\to \\infty}(\\overline{PH}-\\overline{QH})\\)의 값은? (단, \\(O\\)는 원점.)</p>
